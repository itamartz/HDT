# THE ACCEPTANCE SHAPE FOR DESIGN 4.5.2's SECRET BAG, and it is the shape MDT
# ships: a JoinDomain step in State Restore, one restart away from the leg that
# collected the credential.
#
# Leg 1 runs and asks for a restart. Leg 2 resumes in the full OS and joins.
#
# WHY THAT ORDERING IS THE WHOLE TEST. Save-HDTRunState redacts every secret on
# the way into state.json, and the leg after a restart rehydrates its variable
# bag from that file - so before the secret bag existed this sequence handed
# Invoke-HDTJoinDomainStep the literal '(set, not shown)' and the step refused
# rather than spending a wrong-password attempt on the one account that can join
# anything to the directory.
#
# THE PASSWORD IS NOT IN THIS FILE, and it never can be. sequence.yaml is
# printed into a text box in the console and stored on a share every machine
# being deployed can read; the step reads HDTDomainAdminPassword out of the
# variable bag (Invoke-HDTJoinDomainStep, "THERE IS NO PASSWORD PROPERTY").
schemaVersion: 1
id: SECRET-BAG-LEGS
name: A domain join one restart after the credential was collected
description: Two legs and one restart, for the secret bag tests.
steps:
  - group: Preinstall
    runIn: WinPE
    steps:
      - name: Prepare the disk
        type: NoOp
        message: pretending to partition
      - name: Restart into the full OS
        type: Restart
        delaySeconds: 5

  - group: State Restore
    steps:
      - name: Join Domain
        type: JoinDomain
        domain: '%HDTJoinDomain%'
        userName: '%HDTDomainAdmin%'
        runIn: FullOS
      - name: Finish
        type: NoOp
        runIn: FullOS
