name: CI

# DESIGN 12.2.5: unit + contract + PSScriptAnalyzer on every push, Windows
# runner, a red suite blocks merge.
#
# TWO EDITIONS, AND THEY ARE HERE FOR DIFFERENT REASONS.
#
# 5.1 IS THE GATE. The engine runs inside WinPE, which has no pwsh, so Windows
# PowerShell 5.1 is the edition that decides whether HDT works. `shell:
# powershell` on windows-latest IS 5.1.
#
# 7 IS THE EVIDENCE 5.1 CANNOT PRODUCE, and without it two contracts were
# asleep:
#
#   - Seven schema contract suites - AppSchema, OsSchema, RulesSchema,
#     SequenceSchema, ShippedDocumentSchema, StateSchema, WorkspaceSchema -
#     open with `-Skip:(-not (Get-Command Test-Json))`, and Test-Json does not
#     exist in 5.1. On a 5.1-only gate all seven Describe blocks skipped whole,
#     so NOTHING anywhere validated schemas/*.schema.json, and nothing proved
#     the hand-written Assert-HDT*Document validators still agreed with them. A
#     schema edit that rejected every shipped sequence.yaml merged green.
#   - PowerShell51Compatibility.Contract: a forbidden operator is a parse error
#     under 5.1 and an ordinary AST node under 7. Only the pair of runs proves
#     the constraint; one engine is half the evidence.
#
# THE MATRIX WAS CUT ONCE, on the argument that a red pwsh leg blocks a merge
# over a shell the product never runs under. That is answered rather than
# ignored: `fail-fast: false` means neither leg can cancel the other, and the
# badge and the release come from the 5.1 leg alone. 7 is evidence; it never
# speaks for the run.
#
# THE TWO LEGS CANNOT COLLIDE. GitHub gives each matrix leg its own runner VM,
# its own checkout and its own out/, and `-Task ci` runs only tests/unit and
# tests/contract - integration and e2e are not in it and never will be - so
# neither leg touches a real DISM artefact, a mounted VHDX or any path the
# other can see. The NUnit results are named for the edition that wrote them
# (pester-<Edition>-<Version>.xml) and uploaded under per-leg artefact names,
# because upload-artifact@v4 refuses a name that already exists. The one
# genuinely shared thing is the remote `badges` branch, so exactly one leg
# pushes to it.
#
# THE REPORTS ARE BUILT BY build.ps1, NOT BY THIS FILE. The test task writes the
# NUnit result and the shields.io tests badge; the runner only uploads and
# pushes them. CI never grows its own private build logic, so anybody can
# reproduce what the badge says by running the same line locally.
#
# COVERAGE IS NOT HERE. Measured, it turns a 10 minute suite into a 98 minute
# one on a developer machine - Pester traces every command 8000 tests execute -
# which on this runner is a multi-hour job in front of every push. It lives in
# coverage.yml, nightly, where nobody is waiting for it.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # the badges branch, below. Nothing else is written.

jobs:
  windows:
    name: ${{ matrix.shell }}
    runs-on: windows-latest

    # The suite is ~10 minutes on a developer machine and ~20 here. GitHub's
    # default is 360, so without this a hung DISM or a wedged Pester runner
    # burns six hours of runner time in front of every push queued behind it.
    # 45 catches a hang without tripping on a slow runner.
    timeout-minutes: 45

    strategy:
      # Both editions always report. Failing fast would hide a 5.1-only break
      # behind a pwsh-only break, or the other way round - and the pwsh leg
      # exists precisely to produce evidence the 5.1 leg cannot, which it does
      # not do if 5.1 can cancel it mid-run.
      fail-fast: false
      matrix:
        shell: [ pwsh, powershell ]

    # The matrix context is NOT available on a step's `shell:` key -- GitHub
    # rejects the whole workflow with "Unrecognized named-value: 'matrix'" and
    # produces a run with zero jobs. It IS available on jobs.<id>.defaults.run,
    # so the shell is selected once here and inherited by every `run:` step.
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # Install-PackageProvider -Name NuGet is a Windows PowerShell 5.1
          # bootstrap. On pwsh 7 it fails outright with "No match was found ...
          # for the provider 'NuGet'" - PowerShell 7 ships PowerShellGet and
          # does not need it. Guard by edition, not by shell name.
          if ($PSVersionTable.PSEdition -eq 'Desktop') {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          }

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester            -RequiredVersion 5.7.1  -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer  -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module powershell-yaml   -RequiredVersion 0.4.12 -Scope CurrentUser -Force

          "$($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion): dependencies installed"

      - name: Build, lint, test, self-check
        run: ./build.ps1 -Task ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per leg: upload-artifact@v4 refuses a name that already exists, so
          # two legs sharing one name fails the second to finish.
          name: pester-${{ matrix.shell }}
          path: out/testResults/*.xml

      # The two numbers on the run's own summary page, so a failure does not
      # have to be read out of twenty thousand lines of Pester output.
      - name: Summarise the run
        if: always()
        run: |
          $summary = @('## HDT build', '')

          foreach ($name in 'tests') {
              $path = "out/badges/$name.json"
              if (Test-Path -LiteralPath $path) {
                  $badge = ConvertFrom-Json ([System.IO.File]::ReadAllText((Resolve-Path $path)))
                  $summary += ('- **{0}**: {1}' -f $badge.label, $badge.message)
              }
          }

          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($summary -join "`n") + "`n")

      # THE BADGES BRANCH. shields.io renders a badge from an endpoint document
      # at any public URL, so the two files build.ps1 wrote are pushed to an
      # orphan branch that holds nothing else and the README points at their raw
      # URL. No coverage service is signed up to and no token is stored - the
      # job's own GITHUB_TOKEN does it, with contents: write and nothing more.
      #
      # ONLY FROM main. A pull request from a fork has a read-only token, and a
      # badge that moved with every PR would report whatever was merged last
      # rather than what is on main.
      #
      # AND ONLY FROM THE 5.1 LEG. This is the one thing in the matrix that is
      # not per-runner: both legs write out/badges/tests.json and both would
      # push it to the same remote ref, so the badge would report whichever
      # runner happened to finish last and the two pushes would race for the
      # same commit parent. 5.1 is the gate, so 5.1 is the leg that speaks for
      # the run.
      - name: Publish badges
        if: always() && matrix.shell == 'powershell' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # NOT ErrorActionPreference = Stop, DELIBERATELY. git writes progress
          # to stderr, and under Windows PowerShell 5.1 a native command writing
          # to stderr with Stop in force raises NativeCommandError - the clone
          # succeeds and the step fails anyway. Exit codes are checked instead,
          # which is what git actually reports with.
          $ErrorActionPreference = 'Continue'

          if (-not (Test-Path -LiteralPath 'out/badges')) {
              Write-Warning 'No badges were produced by this run; nothing to publish.'
              exit 0
          }

          $work = Join-Path $env:RUNNER_TEMP 'hdt-badges'
          $remote = "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY"

          git config --global user.name  'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # A shallow clone of the branch if it exists, a brand new empty
          # repository if it does not. Never an orphan checkout of THIS working
          # tree: that is one `git rm -rf .` away from deleting the checkout the
          # build just ran from.
          git clone --depth 1 --branch badges --quiet $remote $work

          if (-not (Test-Path -LiteralPath (Join-Path $work '.git'))) {
              "badges: the branch does not exist yet, starting it"
              New-Item -ItemType Directory -Force -Path $work | Out-Null
              git -C $work init --quiet --initial-branch=badges
              git -C $work remote add origin $remote
          }

          Copy-Item -Path 'out/badges/*.json' -Destination $work -Force

          git -C $work add -A
          git -C $work diff --cached --quiet

          # --quiet exits 1 when something IS staged. Zero means the numbers did
          # not move, and a commit per push saying so is noise.
          if ($LASTEXITCODE -eq 0) {
              "badges: unchanged, nothing to push"
              exit 0
          }

          git -C $work commit --quiet -m "badges: $env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed with $LASTEXITCODE" }

          git -C $work push --quiet origin badges
          if ($LASTEXITCODE -ne 0) { throw "git push failed with $LASTEXITCODE" }

          Get-Content -Path 'out/badges/*.json'
          "badges: pushed to the badges branch"

          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
