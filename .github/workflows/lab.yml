name: Lab

# THE GATE, RUN AGAIN ON A MACHINE THAT IS NOT A FRESH CONTAINER.
#
# ci.yml proves the suite passes on a Windows image GitHub built ten minutes
# ago, with nothing installed on it but what the workflow installed. That is
# worth having and it is not the question an administrator asks. HDT is
# installed onto machines that have been used - that have an ADK, a Hyper-V
# role, a PSModulePath somebody else's product wrote into, an execution policy
# somebody set - and the only machine here shaped like that is GHRUNNER01, a
# nested-virtualisation guest on the MS-A2 lab host, itself deployed by HDT from
# the lab's own deployment share.
#
# So this runs ./build.ps1 -Task ci there, on every push to main. Same task,
# same entry point, different hardware. It is not a second gate with its own
# rules; a difference between the two runs is a fact about the machine, and
# that fact is the whole reason this file exists.
#
# ---------------------------------------------------------------------------
# THIS REPOSITORY IS PUBLIC, AND THAT DECIDES THE TRIGGERS.
#
# There is NO pull_request trigger here and there must never be one, for the
# reason e2e.yml's header gives at length: GHRUNNER01 sits on a private LAN
# beside machines belonging to somebody else's lab, and it holds Hyper-V
# administrator rights over a nested hypervisor.
#
# AND FOR ONE MORE REASON, WHICH IS THE REASON THIS IS A SEPARATE FILE RATHER
# THAN A JOB IN ci.yml. On `pull_request`, GitHub runs the workflow file FROM
# THE PULL REQUEST'S HEAD. So an `if: github.event_name != 'pull_request'`
# written on a self-hosted job inside ci.yml would be a guard the fork gets to
# EDIT, in the same commit that adds the runner labels. A guard in a
# fork-editable file guards nothing. The absence of the trigger is the only
# control that cannot be rewritten by the thing it is controlling, and it can
# only be absent if the file has no other reason to have it.
#
# THE OWNER GUARD IS THE SECOND CONTROL, and it is the first job below - hosted,
# comparing `github.actor` and `github.triggering_actor` with
# `github.repository_owner`, with the lab job `needs:`ing it. A separate job
# that FAILS rather than an `if:` that SKIPS, because GitHub calls a workflow
# whose jobs all skipped a success. E2eWorkflow.Tests.ps1 asserts that shape
# over the SET of workflow files, so this file was judged by it before it ran
# once.
#
# NO contents: write. The badges used to be pushed by the job that produced
# them; they are not any more, and this is why. A writable GITHUB_TOKEN on a
# machine somebody owns is what turns a compromised job into a compromised
# repository. This job uploads the numbers as an artifact and badges.yml, on
# GitHub's own hardware, does the write.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# AND IT DOES NOT RUN FOR EVERY COMMIT, WHICH IS THE `changes` JOB BELOW.
#
# Nine minutes of GHRUNNER01 is not nine minutes of a container farm. There is
# one of that machine, it is reverted to a checkpoint every hour, and e2e.yml
# wants it too - so a run started to prove that a README paragraph still reads
# well is a run the next real question has to queue behind.
#
# THE CONDITION AS ASKED FOR IS "HAS ModuleVersion MOVED", AND ON ITS OWN IT
# WOULD HAVE BEEN A MUCH BIGGER CHANGE THAN IT SOUNDS. ./build.ps1 -Task ci
# runs the `version` task, which rewrites ModuleVersion in the manifest on
# every build - and that bump is reverted before every commit, deliberately, so
# the tree stays clean. The number therefore moves on a deliberate release and
# almost nowhere else: 34 of this repository's 941 commits, and 2 of the last
# 40. A version-only gate would not have meant "docs commits do not spend the
# lab machine"; it would have meant "main is validated at a release and at no
# other time", on a branch ci.yml no longer carries a `push:` for.
#
# SO THE VERSION IS THE FIRST CLAUSE AND NOT THE ONLY ONE. A moved
# ModuleVersion starts the lab. So does any changed file that is not a
# document, a plan or a workflow - and THAT is the direction the list runs in,
# because the default has to be to run. A path nobody thought about when this
# was written starts the lab; only a named, inert one does not. The failure
# that costs something is a change reaching main unvalidated, not a machine
# running for nine minutes it did not have to.
#
# WHAT A SKIP LOOKS LIKE, AND WHO COULD BE MISLED BY IT. The `lab` job reports
# Skipped and the run reports success - GitHub calls a workflow whose jobs all
# succeeded or skipped a success - so a docs commit gets a green tick that
# means "nothing here needed the lab machine" rather than "the suite passed on
# it". Nothing downstream reads that as a pass: badges.yml fires on `completed`
# regardless of conclusion, finds no `badges` artifact, and its download step
# is continue-on-error with a publish action that exits clean on an empty
# directory - so the badge keeps the numbers from the last run that produced
# any, which is the last run that measured anything. And the release path never
# looks here at all: publish.yml calls ci.yml and e2e.yml directly rather than
# reading this workflow's conclusion, so a tag cannot ship on the strength of a
# skipped job.
#
# THE COST, STATED RATHER THAN HIDDEN: a documentation-only commit that breaks
# a documentation contract test is not caught within nine minutes. It is caught
# by ci.yml, which still runs on every pull request and every Monday.
#
# THE ONE CASE THIS GATE GETS WRONG, WRITTEN DOWN BECAUSE IT WILL LOOK LIKE A
# BUG WHEN SOMEBODY MEETS IT. The base of the comparison is
# github.event.before - the tip before THIS push - and the concurrency group
# below cancels a run in flight. So: push some source, then push a README fix
# inside the next nine minutes. The first run is cancelled before the lab
# finishes, the second compares only the README against the source commit, and
# the source commit is never validated by this machine. It is validated by the
# next push that touches source, because that push's range still ends at a tip
# containing it - so this is a DELAY, not a hole that stays open, and nothing
# is reported as passing that did not.
#
# CLOSING IT PROPERLY MEANS ASKING THE API WHICH COMMIT THE LAB LAST ACTUALLY
# RAN ON, walking recent runs for one whose `lab` job is not `skipped`. That is
# a real amount of machinery and an `actions: read` token in a file that is
# deliberately spare, and it buys a delay rather than a correctness property.
# It is not here. If the delay ever costs something, that is the fix.
#
# A workflow_dispatch ALWAYS RUNS THE LAB. Pressing the button is a deliberate
# act, and the commonest reason to press it - the `clean` checkpoint has just
# been retaken and the machine wants proving - is exactly the moment when
# nothing about the last push has changed.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# SETTING GHRUNNER01 UP FOR THIS, WHICH IS TWO THINGS AND THE SECOND ONE IS THE
# ONE THAT GETS FORGOTTEN.
#
# 1. A SECOND RUNNER INSTANCE, ALONGSIDE THE ONE e2e.yml USES:
#
#        cd C:\
#        mkdir C:\actions-runner-2
#        cd C:\actions-runner-2
#        # unpack the same actions-runner-win-x64 archive the first one used
#        .\config.cmd --url https://github.com/<owner>/<repo> `
#                     --token <a fresh registration token from the repo's
#                              Settings > Actions > Runners > New runner page> `
#                     --name GHRUNNER01-ci `
#                     --labels hdt-ci `
#                     --runasservice
#
#    TWO INSTANCES, AND NOT THREE. One CI job already uses 6 of this machine's
#    8 cores; a third concurrent job would make all of them slower and would
#    start reporting timing flakes that are the runner's fault and look like
#    the suite's.
#
#    SEPARATE LABELS ARE THE POINT OF THE SECOND INSTANCE. `hdt-ci` here,
#    `hyperv-nested` on the first: a twenty-minute gate must not queue behind a
#    six-hour deployment run, and a deployment run must not queue behind the
#    gate. One instance with both labels would give exactly that.
#
# 2. RETAKE THE `clean` HYPER-V CHECKPOINT AFTERWARDS. THIS IS NOT OPTIONAL AND
#    IT IS NOT COSMETIC.
#
#    MS-A2 reverts GHRUNNER01 to its `clean` checkpoint every hour, and the
#    runner's REGISTRATION - its credentials, its .runner and .credentials
#    files - lives inside that checkpoint. That is deliberate (see e2e.yml: it
#    is what makes the machine ephemeral without a long-lived PAT stored on
#    it). It also means a runner registered AFTER the checkpoint was taken is
#    destroyed by the next revert.
#
#    WHAT THAT FAILURE LOOKS LIKE, so nobody spends an afternoon on it: the
#    runner goes permanently Offline in the repository's settings, and every
#    job targeting `hdt-ci` sits queued for ever. There is no error. There is
#    no failed run. There is a workflow that never starts, on a label nothing
#    answers to, and GitHub cancels it 24 hours later.
#
#    So: configure the second instance, confirm both runners show Idle, THEN
#    take the checkpoint again.
#
#    AND SETTLE WINDOWS UPDATE BEFORE YOU TAKE IT. A CHECKPOINT IS A REBOOT
#    THAT HAPPENS EVERY HOUR FOR EVER.
#
#    A standard checkpoint saves the running memory as well as the disk, so
#    the revert restores not a booted machine but the exact instant it was
#    taken - including "an update is staged and I am waiting to restart". The
#    guest then restarts itself tens of minutes into every hour, on its own
#    schedule, with no relation to whether a job is running.
#
#    WHAT THAT FAILURE LOOKS LIKE, since there is no error to search for: the
#    job checks out, starts build.ps1 and stops, every step from "Build, lint,
#    test, self-check" onward reporting conclusion `null`, and `gh run view
#    --log` answering "log not found" because the worker went down with the
#    machine and never uploaded one. It has happened once, and
#    `.planning/SPIKES.md` S26 has that run, its timestamps and the evidence.
#
#    So: install everything outstanding, reboot until nothing is pending, THEN
#    take the checkpoint. The guest must be idle in the sense of having
#    nothing left it wants to do, not merely idle of runner work. Automatic
#    updates are switched off there now for the same reason - a machine
#    reverted hourly can only ever install one mid-job and throw it away - so
#    this is a check rather than a chore, until somebody turns them back on.
#
# THERE WERE TWO MORE STEPS HERE AND THEY ARE DONE, WHICH IS WHY THE LIST IS
# TWO ITEMS LONG. They were repository edits rather than machine setup, they
# happen once for the life of the project, and rebuilding GHRUNNER01 does not
# bring them back - so leaving them written as instructions would tell the next
# person to remove something that is already gone. What they were, kept in one
# paragraph because the reasoning is still load-bearing:
#
# UNTIL THIS MACHINE ANSWERED TO `hdt-ci`, ci.yml CARRIED A TRANSITIONAL `push:
# branches: [main]` and the README's status badge pointed at ci.yml. Both for
# the same reason: a job queued against a label no runner carries does not fail
# - the silent failure described in step 2 - so something had to validate main
# in the meantime, and a status badge has to name a workflow that can actually
# COMPLETE. Pointed here while every run of this file queued and was then
# cancelled, GitHub rendered the cancellation as "failing": a green gate and a
# front page saying the build was broken. Run 34281209809 on 2026-09-08 was the
# first CI-Lab run to go green on main; the trigger and the badge moved in that
# same commit, and CiWorkflow.Tests.ps1 now asserts the steady state - no
# `push:` on ci.yml, no note describing one, and the status badge naming this
# file.
#
# NOT the `tests` badge on the line below it in the README. That one is a
# number from the badges branch, written by badges.yml on `workflow_run` after
# THIS workflow, so it has always linked here - correctly, because that is
# where the number comes from. It reports no run's conclusion and nothing about
# it changed.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ main ]
  workflow_dispatch:

  # COVERAGE, ON A CLOCK. It is an hour of a hosted runner and it measures
  # main, so it answers a schedule rather than a push - and it is in THIS file
  # because publishing its badge needs the write token only this file may hold.
  schedule:
    - cron: '0 3 * * *'

  # CALLED BY publish.yml, FOR THE LAB GATE AND THE END-TO-END SUITE BOTH.
  #
  # STILL NO pull_request, AND THAT IS THE WHOLE DESIGN. This file holds the
  # self-hosted jobs and the one job that may write to the repository, so it is
  # the file a fork must never be able to start. On `pull_request` GitHub runs
  # a workflow FROM THE PULL REQUEST'S HEAD - so any `if:` keeping a fork off
  # the lab runner would be a guard the fork edits in the same commit that adds
  # the runner labels. The ABSENCE of the trigger is the only control that
  # cannot be rewritten by the thing it controls, and it is why gate.yml
  # exists: the unprivileged half carries pull_request so this half never has
  # to.
  #
  # A CALLED WORKFLOW SEES THE CALLER'S EVENT, so github.event_name is 'push'
  # for a tag. The REF tells them apart - refs/tags/* from the release path,
  # refs/heads/main from an ordinary push - and the conditions below are
  # written on the ref for that reason.
  workflow_call:
    inputs:
      timeoutMinutes:
        description: 'Minutes before the end-to-end job is cancelled. The release path wants a shorter one than a run somebody started by hand.'
        type: number
        required: false
        default: 360

# TWO QUICK PUSHES MUST COLLAPSE, NOT QUEUE. There is exactly one of this
# machine. A hosted runner pool absorbs a burst of commits by starting a
# container each; here they run one after another, so three commits in five
# minutes is an hour of the lab machine spent answering a question only the
# last of them asked.
#
# PER REF, so a hand-started run on a branch and the push to main do not cancel
# each other.
concurrency:
  group: ci-lab-${{ github.ref }}
  cancel-in-progress: true

# READ ONLY, AND NOTHING ELSE - the same rule as e2e.yml, asserted over the set
# of workflow files in E2eWorkflow.Tests.ps1. The badges leave here as an
# artifact and are written by badges.yml.
permissions:
  contents: read

jobs:

  # ==========================================================================
  # WHO STARTED THIS, ANSWERED ON GITHUB'S HARDWARE BEFORE ANY OF IT REACHES
  # THE LAB. The same guard e2e.yml carries, and it is here for the same
  # reasons - a separate job so that a refusal FAILS rather than SKIPS, on a
  # hosted runner because a guard that runs on the machine it guards has
  # already lost the checkout.
  #
  # ON A PUSH TO main BOTH ACTORS ARE THE PUSHER, so this is close to a
  # formality today: only somebody with write access can push here at all. It
  # is not a formality on `workflow_dispatch`, which any collaborator can press,
  # and it will not be one the day this repository has a second writer.
  # ==========================================================================
  guard:
    name: actor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      # THE NAMES GO THROUGH `env:`, NOT INTO THE SHELL LINE. Interpolating
      # `${{ github.actor }}` straight into a script is the script-injection
      # shape - the value is attacker-chosen text on some events - and an
      # environment variable is read as data rather than parsed as code.
      - name: Only the repository owner may start a run on the lab machine
        env:
          HDT_ACTOR: ${{ github.actor }}
          HDT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          HDT_OWNER: ${{ github.repository_owner }}
          HDT_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # triggering_actor is set on every event GitHub documents, but an
          # empty one must not read as "not the owner". Absent falls back to
          # actor, which is checked anyway.
          pressed="${HDT_TRIGGERING_ACTOR:-$HDT_ACTOR}"

          echo "event: ${HDT_EVENT}"
          echo "actor: ${HDT_ACTOR}"
          echo "triggering actor: ${pressed}"
          echo "repository owner: ${HDT_OWNER}"

          if [ "${HDT_ACTOR}" != "${HDT_OWNER}" ] || [ "${pressed}" != "${HDT_OWNER}" ]; then
            echo "::error::this gate runs on GHRUNNER01 - a real machine on a private LAN, holding Hyper-V administrator rights over a nested hypervisor - and only '${HDT_OWNER}' may start it. This run was started by '${HDT_ACTOR}' and triggered by '${pressed}'. Nothing was checked out onto that machine."
            exit 1
          fi

          echo "started by the repository owner; the lab machine may go ahead."

  # ==========================================================================
  # IS THERE ANYTHING IN THIS PUSH THE LAB MACHINE HAS NOT ALREADY SEEN?
  # ANSWERED ON GITHUB'S HARDWARE, WHICH IS THE ENTIRE POINT OF THE JOB.
  #
  # A check that ran on GHRUNNER01 would have checked out onto it, started a
  # worker and taken the slot it was deciding whether to take - so it has to be
  # made somewhere the answer is free. HOSTED, and a SECOND hosted job, which
  # is why the "one self-hosted job" rule below is untouched by it.
  #
  # BEHIND THE GUARD, NOT IN FRONT OF IT. The guard FAILS and this one SKIPS,
  # and a run started by somebody who is not the owner has to be told that
  # rather than told a version did not move.
  #
  # AN `if:` HERE IS RIGHT WHERE AN `if:` ON THE GUARD WOULD HAVE BEEN WRONG,
  # and the difference is worth writing down because the two sit ten lines
  # apart. A skipped job reports success. For "you are not allowed to start
  # this" that is a refusal that reads as a pass, which is why the guard is a
  # job that exits 1. For "nobody needs the lab machine for this commit"
  # success is the honest answer, and skipping is the behaviour being asked
  # for.
  # ==========================================================================
  changes:
    name: version
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    # THE WHOLE MECHANISM IS THIS OUTPUT AND THE `if:` ON `lab` THAT READS IT.
    # An output wired to no step is the empty string, the empty string is not
    # 'true', and the lab would then never run again with nothing anywhere
    # saying why - so CiLabWorkflow.Tests.ps1 asserts both ends of the wire.
    outputs:
      run: ${{ steps.decide.outputs.run }}

    steps:
      # fetch-depth: 0, AND A SHALLOW CHECKOUT IS THE REASON. The default is
      # one commit deep and `git diff` against anything older than it fails -
      # and the base here is github.event.before, the tip BEFORE the push,
      # which can be many commits back. It has to be, too: a push is not one
      # commit, and source in the first commit with a README fix in the second
      # would look like a documentation push to anything comparing HEAD with
      # its parent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Has the version moved, or anything the gate actually reads
        id: decide
        env:
          HDT_EVENT: ${{ github.event_name }}
          HDT_BEFORE: ${{ github.event.before }}
          HDT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          manifest='src/Hephaestus/Hephaestus.psd1'

          # THE SKIP LIST, ON ONE LINE, BECAUSE A TEST READS THIS LINE.
          # CiLabWorkflow.Tests.ps1 asserts the SET both ways: that docs/,
          # .planning/, .github/ and README.md are all in it, and that src/,
          # tests/, schemas/ and build.ps1 are NOT - which is the case that
          # fails the day somebody widens the skip to quieten a noisy run.
          #
          # NAMED, NOT INFERRED. Everything absent from this line starts the
          # lab, including a directory that does not exist yet.
          inert='^README\.md$|^NOTICE\.md$|^CHANGELOG\.md$|^LICENSE$|^\.gitignore$|^\.gitattributes$|^docs/|^\.planning/|^\.github/|^\.claude/|\.md$'

          decide () {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$2"
            printf '%s\n' "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          echo "event: ${HDT_EVENT}"
          echo "before: ${HDT_BEFORE:-none}"
          echo "head:   ${HDT_HEAD}"

          # A HAND-STARTED RUN IS A DELIBERATE ACT and never skips. The
          # commonest reason to press the button is that the `clean` checkpoint
          # has just been retaken and the machine wants proving, which is
          # precisely when nothing about the last push has changed.
          if [ "${HDT_EVENT}" != 'push' ]; then
            decide true "started by hand (${HDT_EVENT}); the lab runs whatever the version says."
          fi

          # NO HONEST COMPARISON MEANS RUN. The first push to a branch, a force
          # push that orphaned the old tip, a `before` of forty zeroes: the safe
          # answer to "I cannot tell" is nine minutes of a machine, not a commit
          # nothing ever checked.
          base="${HDT_BEFORE:-}"
          if [ -z "${base}" ] ||
             [ "${base}" = '0000000000000000000000000000000000000000' ] ||
             ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            decide true "there is no commit to compare against (before: '${base:-none}'); the lab runs."
          fi

          version_at () {
            git show "$1:${manifest}" 2>/dev/null |
              sed -n "s/^[[:space:]]*ModuleVersion[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" |
              head -n 1
          }

          was="$(version_at "${base}")"
          now="$(version_at "${HDT_HEAD}")"
          echo "ModuleVersion: '${was:-none}' -> '${now:-none}'"

          # THE FIRST CLAUSE, AND THE ONE THIS WAS ASKED FOR BY NAME.
          if [ "${was}" != "${now}" ]; then
            decide true "ModuleVersion moved ${was:-none} -> ${now:-none}; this is a release-shaped commit and the lab runs."
          fi

          changed="$(git diff --name-only "${base}" "${HDT_HEAD}")"
          echo 'files this push changed:'
          printf '%s\n' "${changed}" | sed 's/^/  /'

          # `|| true` ON THE WHOLE PIPELINE, because grep exits 1 when it
          # matches nothing and `set -e` would read that as the step failing -
          # on precisely the input that means "skip".
          meaningful="$(printf '%s\n' "${changed}" | grep -v '^$' | grep -Ev "${inert}" || true)"

          if [ -n "${meaningful}" ]; then
            decide true "$(printf 'the gate reads files this push changed:\n%s' "$(printf '%s\n' "${meaningful}" | sed 's/^/  /')")"
          fi

          decide false "ModuleVersion is unchanged at ${now:-none} and every file this push touched is a document, a plan or a workflow. GHRUNNER01 is not started for it."

  # ==========================================================================
  # ONE JOB ON THE LAB MACHINE, AND THAT IS A CONSTRAINT RATHER THAN A TIDY
  # SHAPE. MS-A2's hourly task reverts GHRUNNER01 to its `clean` checkpoint,
  # and it skips only while Runner.Worker.exe exists in the guest (PROJECT.md,
  # "GHRUNNER01"). Two consecutive self-hosted jobs leave a window between the
  # workers with no such process, the revert can land in it, and what that
  # looks like from here is a second job whose workspace vanished mid-run. So
  # everything that has to happen on that machine happens inside this one job.
  # CiLabWorkflow.Tests.ps1 asserts there is exactly one.
  # ==========================================================================
  lab:
    name: powershell
    needs: [ guard, changes ]

    # THE SKIP HAS TO BE ON THIS JOB. A condition anywhere else - inside a
    # step, inside build.ps1 - has already queued against `hdt-ci`, started a
    # worker on GHRUNNER01 and checked the repository out onto it, which is
    # the whole thing being saved.
    # AND NEVER ON A TAG. publish.yml has already run this exact gate on hosted
    # hardware through gate.yml before it reaches here; running it again on the
    # lab machine would put a SECOND self-hosted job in the same run as the
    # end-to-end suite, and the gap between two of them is where the hourly
    # checkpoint revert lands. Exactly one self-hosted job per run.
    if: needs.changes.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/')

    runs-on: [self-hosted, windows, hdt-ci]

    # ~10 minutes on a developer machine, ~20 on a hosted runner. GitHub's
    # default is 360, and six hours of a machine there is exactly one of is six
    # hours nothing else can be tested on. 60 catches a hang without tripping
    # on a slow morning.
    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      # NOT INSTALLED HERE, VERIFIED HERE. ci.yml installs its dependencies on a
      # fresh hosted runner every time; this machine is built once and reverted
      # to a checkpoint between jobs, so an Install-Module on every run would be
      # a network round trip to prove something that cannot have changed. What
      # can go wrong is the checkpoint being older than the pins, and that is
      # what this reports - by name and version, before anything long starts.
      #
      # THE SAME STEP AS e2e.yml's, CHARACTER FOR CHARACTER, and asserted that
      # way in CiLabWorkflow.Tests.ps1. Two hand-maintained copies of a version
      # pin is how two runner instances on one machine come to disagree about
      # what is installed on it.
      - name: Check the build dependencies
        run: |
          $ErrorActionPreference = 'Stop'

          $wanted = @{
              'Pester'           = '5.7.1'
              'PSScriptAnalyzer' = '1.25.0'
              'powershell-yaml'  = '0.4.12'
          }

          $missing = @()
          foreach ($name in $wanted.Keys | Sort-Object) {
              $found = Get-Module -Name $name -ListAvailable |
                  Where-Object { [string] $_.Version -eq $wanted[$name] }

              if ($found) { "{0} {1}: present" -f $name, $wanted[$name] }
              else {
                  $have = (Get-Module -Name $name -ListAvailable | ForEach-Object { [string] $_.Version }) -join ', '
                  $missing += ("{0} {1} is not installed on this runner (found: {2}). Install-Module {0} -RequiredVersion {1} -Scope AllUsers -Force, then retake the 'clean' checkpoint - otherwise the next revert loses it." -f
                      $name, $wanted[$name], $(if ($have) { $have } else { 'nothing' }))
              }
          }

          if ($missing) { throw ($missing -join "`n") }

          "$($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion) on $env:COMPUTERNAME"

      # ./build.ps1 -Task ci RUNS version, WHICH REWRITES ModuleVersion in the
      # manifest - the v0.4.0 defect. It is harmless here for the reason it is
      # harmless in publish.yml's gate job: this job has its own checkout, the
      # bump lands in a tree the next checkpoint revert throws away, and
      # nothing downstream reads the manifest from it.
      - name: Build, lint, test, self-check
        run: ./build.ps1 -Task ci

      # continue-on-error for the reason ci.yml's upload step spells out at
      # length: run 34250900149 passed every check it makes and reported
      # failure on an HTTP 403 from artifact storage while finalising. The
      # verdict is build.ps1's; a blob store refusing a convenience copy does
      # not get a vote. Asserted over the set in CiWorkflow.Tests.ps1.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pester-ci-lab
          path: out/testResults/*.xml

      # THE NUMBERS, ON THEIR WAY TO A JOB THAT IS ALLOWED TO WRITE THEM.
      # badges.yml downloads this artifact from this run and pushes it to the
      # badges branch. It is `always()` because build.ps1 writes the badges
      # BEFORE it judges the suite: a red run has a red badge to publish, and a
      # badge that only updates when the build is green is a badge that always
      # says green.
      - name: Upload the badges
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: badges
          path: out/badges/*.json
          if-no-files-found: warn

      - name: Summarise the run
        if: always()
        run: |
          $summary = @('## HDT build (lab machine)', '')

          foreach ($name in 'tests') {
              $path = "out/badges/$name.json"
              if (Test-Path -LiteralPath $path) {
                  $badge = ConvertFrom-Json ([System.IO.File]::ReadAllText((Resolve-Path $path)))
                  $summary += ('- **{0}**: {1}' -f $badge.label, $badge.message)
              }
          }

          $summary += ('- ran on **{0}**' -f $env:COMPUTERNAME)

          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($summary -join "`n") + "`n")

  e2e:
    name: hyper-v

    # NEVER IN THE SAME RUN AS THE GATE JOB, AND THIS DOES NOT `needs:` IT.
    #
    # The danger is not two self-hosted jobs at once - it is two of them IN
    # SEQUENCE. Between them no Runner.Worker.exe exists in the guest, and
    # MS-A2's hourly checkpoint revert skips only while that process is alive
    # (PROJECT.md, "GHRUNNER01"). A revert landing in that gap takes the
    # workspace the second job was about to use, and it looks from here like a
    # checkout that vanished mid-run.
    #
    # SO THE TWO ARE MUTUALLY EXCLUSIVE BY TRIGGER, not ordered by `needs:`.
    # A push to main runs the gate and not this; a tag runs this and not the
    # gate, because publish.yml has already run the gate on hosted hardware
    # through gate.yml. Exactly one self-hosted job per run, which is the
    # property that survived the merge.
    needs: [ guard, changes ]

    # DISPATCH OR A RELEASE, NEVER A PUSH TO main. The suite builds virtual
    # machines and takes 41 minutes; on every push it would not be a gate, it
    # would be the reason nobody reads the gate. A tag arrives here as a push
    # whose ref is refs/tags/*, which is how the release path asks for it -
    # see the workflow_call note in the trigger block.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, windows, hyperv-nested]

    # It deploys Windows to VMs from a WinPE image it builds first. Six hours is
    # not a target, it is the point past which something has hung - and it is
    # what a run somebody started by hand gets, where nobody is waiting on a
    # release.
    #
    # A RELEASE PASSES A SHORTER ONE. `timeout-minutes` is not a key GitHub
    # allows on a job that calls a reusable workflow, so the caller cannot set
    # this from outside; it hands in a number and this job applies it.
    #
    # THE `|| 360` IS NOT DECORATION. An input declared under workflow_call
    # gets its default only when the workflow is CALLED. On a
    # workflow_dispatch, `inputs.timeoutMinutes` is null, and a bare
    # `timeout-minutes: ${{ inputs.timeoutMinutes || 360 }}` is then an empty value
    # and an invalid workflow file - a run with zero jobs, not an error.
    #
    # AND IT DOES NOT BOUND THE WAIT FOR A RUNNER. timeout-minutes starts when
    # the job starts. GHRUNNER01 is a VM on another host and is not always up;
    # a job with nowhere to run sits queued, and GitHub cancels it after 24
    # hours. That is the outer bound on a release whose lab is switched off:
    # slow, but it fails rather than publishing unproven.
    timeout-minutes: ${{ inputs.timeoutMinutes || 360 }}

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      # NOT INSTALLED HERE, VERIFIED HERE. ci.yml installs its dependencies on a
      # fresh hosted runner every time; this machine is built once and reverted
      # to a checkpoint between jobs, so an Install-Module on every run would be
      # a network round trip to prove something that cannot have changed. What
      # can go wrong is the checkpoint being older than the pins, and that is
      # what this reports - by name and version, before anything long starts.
      - name: Check the build dependencies
        run: |
          $ErrorActionPreference = 'Stop'

          $wanted = @{
              'Pester'           = '5.7.1'
              'PSScriptAnalyzer' = '1.25.0'
              'powershell-yaml'  = '0.4.12'
          }

          $missing = @()
          foreach ($name in $wanted.Keys | Sort-Object) {
              $found = Get-Module -Name $name -ListAvailable |
                  Where-Object { [string] $_.Version -eq $wanted[$name] }

              if ($found) { "{0} {1}: present" -f $name, $wanted[$name] }
              else {
                  $have = (Get-Module -Name $name -ListAvailable | ForEach-Object { [string] $_.Version }) -join ', '
                  $missing += ("{0} {1} is not installed on this runner (found: {2}). Install-Module {0} -RequiredVersion {1} -Scope AllUsers -Force, then retake the 'clean' checkpoint - otherwise the next revert loses it." -f
                      $name, $wanted[$name], $(if ($have) { $have } else { 'nothing' }))
              }
          }

          if ($missing) { throw ($missing -join "`n") }

          "$($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion) on $env:COMPUTERNAME"

      # THE TASK REFUSES AN UNELEVATED SESSION, and says so plainly, so this is
      # only here to fail on the right sentence rather than forty minutes into a
      # build. The runner service account has to be a local administrator.
      - name: Check elevation and Hyper-V
        run: |
          $ErrorActionPreference = 'Stop'

          $elevated = ([Security.Principal.WindowsPrincipal] [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $elevated) {
              throw 'the runner service is not running elevated. tests/e2e creates virtual machines and mounts VHDXs; ./build.ps1 -Task e2e refuses without it.'
          }

          if (-not (Get-Module -Name 'Hyper-V' -ListAvailable)) {
              throw 'the Hyper-V PowerShell module is not present on this runner. Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-Management-PowerShell.'
          }

          Get-VMHost | Select-Object VirtualMachinePath, VirtualHardDiskPath | Format-List
          "elevated, Hyper-V present"

      - name: End-to-end
        run: ./build.ps1 -Task e2e

      # continue-on-error on this and the diagnostics below, for the reason
      # ci.yml's upload step spells out: a 403 from GitHub's artifact storage is
      # not a verdict on the code. It matters more here - the screenshots are
      # the only record of why a VM did not come up, so the upload failing must
      # not also erase which assertion failed.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pester-e2e
          path: out/testResults/*.xml

      # THE SCREENSHOTS AND DEPLOYMENT LOGS, WHICH ARE THE ONLY RECORD OF WHY A
      # VM DID NOT COME UP. A failed e2e assertion says a machine never reported
      # its heartbeat; the picture of the screen and the share's own log say
      # what it was doing instead. They are worth more than the .xml here.
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: e2e-diagnostics
          path: |
            C:/HDTLab/scratch/**/*.png
            C:/HDTLab/scratch/**/*.log
          if-no-files-found: ignore

      - name: Summarise the run
        if: always()
        run: |
          $summary = @('## HDT end-to-end', '')

          $results = Get-ChildItem -Path 'out/testResults' -Filter 'pester-e2e-*.xml' -ErrorAction SilentlyContinue
          foreach ($file in $results) {
              [xml] $xml = Get-Content -LiteralPath $file.FullName -Raw
              $run = $xml.'test-results'
              if ($run) {
                  $summary += ('- **{0}**: {1} total, {2} failed, {3} not run' -f
                      $file.Name, $run.total, $run.failures, $run.'not-run')
              }
          }

          if ($results.Count -eq 0) { $summary += '- no result file was produced; the suite did not get as far as writing one.' }

          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($summary -join "`n") + "`n")

  # ==========================================================================
  # THE BADGES, WHICH WERE badges.yml AND NEEDED workflow_run TO BE SAFE THERE.
  #
  # A badge job holds contents: write, and the danger has never been the token
  # itself - it is a writable token in a file a pull request can EDIT. badges.yml
  # solved that with `workflow_run`, which GitHub always runs from the DEFAULT
  # BRANCH's copy, so nothing a fork wrote decided what it did.
  #
  # THAT INDIRECTION IS UNNECESSARY IN A FILE WITH NO FORK-REACHABLE TRIGGER.
  # This file answers push:[main], workflow_dispatch and workflow_call, and a
  # fork can start none of them. So the job can sit beside the run that
  # produced the numbers and read them from the same run - no download from
  # another run id, no actions: read.
  #
  # THE WRITE IS ON THIS JOB AND NOWHERE ELSE. The workflow grants
  # contents: read; this one job raises it, and it runs on ubuntu-latest. The
  # self-hosted jobs above never hold it, which is the rule that has not
  # changed: a writable token on a machine somebody owns is what turns a
  # compromised job into a compromised repository.
  # ==========================================================================
  badges:
    name: badges
    needs: [ lab, coverage ]

    # ONE WRITER AT A TIME ON THAT BRANCH, AND NEVER CANCELLED HALF WAY. The
    # push has no rebase and no retry, so two badge jobs pushing at once means
    # one of them fails - and a failed badge push turns a green build red for a
    # reason that appears nowhere in the build's own log. A push killed halfway
    # leaves the branch carrying a tests badge from one run and a coverage badge
    # from another, with nothing anywhere to say so. Queueing is the point.
    concurrency:
      group: badges
      cancel-in-progress: false
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Take the numbers the gate produced
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: badges
          path: out/badges

      - name: Publish badges
        uses: ./.github/actions/publish-badges
        with:
          path: out/badges
          token: ${{ secrets.GITHUB_TOKEN }}
          message: badges

      - name: Summarise what was published
        if: always()
        run: |
          {
            echo '## HDT badges'
            echo
            echo "- from run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- lab: ${{ needs.lab.result }}, coverage: ${{ needs.coverage.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # COVERAGE, WHICH WAS coverage.yml AND LIVES HERE BECAUSE OF ITS BADGE.
  #
  # IT RUNS ON A HOSTED RUNNER AND COULD HAVE GONE IN gate.yml - and must not,
  # for a reason that only appears when you follow what it PRODUCES. Coverage
  # writes a badge, publishing a badge needs contents: write, and gate.yml
  # carries pull_request so it can never hold that token. A coverage job over
  # there would measure a number nothing could publish, and the badge would
  # quietly show whatever it last said.
  #
  # SO THE JOB FOLLOWS ITS BADGE into the file that can write one. That is the
  # privilege rule doing its job: what a thing NEEDS decides where it lives,
  # not what it is about.
  #
  # IT IS STILL SLOW AND STILL SCHEDULED. Pester traces every command the suite
  # executes; the last two runs took 1h4m and 1h5m. The `if:` below keeps it off
  # every other trigger this file answers.
  # ==========================================================================
  coverage:
    name: coverage

    # NEVER ON A PULL REQUEST. Four hours of a hosted runner is not a thing a
    # PR should be able to start, and the number it produces is about main
    # rather than about a proposal. Its own file used to express this by having
    # no pull_request trigger; in a shared file it is an `if:`, and that is
    # safe HERE - unlike a guard on a self-hosted job - because this file holds
    # nothing a fork could want. It runs on windows-latest with contents: read,
    # which is what a fork already gets.
    if: github.event_name == 'schedule'
    runs-on: windows-latest

    # The suite takes 20 minutes here without coverage. This one is allowed to
    # take two hours, and is killed rather than left burning if it takes six.
    timeout-minutes: 240

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester            -RequiredVersion 5.7.1  -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module powershell-yaml   -RequiredVersion 0.4.12 -Scope CurrentUser -Force

          "$($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion): dependencies installed"

      - name: Test with coverage
        run: ./build.ps1 -Task test -Coverage -Verbosity None

      # continue-on-error on both, for the reason ci.yml's upload step spells
      # out: a 403 from GitHub's artifact storage is not a verdict on the code,
      # and a diagnostic copy does not get to fail the run that produced it.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-jacoco
          path: out/coverage/coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pester-coverage-run
          path: out/testResults/*.xml

      - name: Summarise the run
        if: always()
        run: |
          $summary = @('## HDT coverage', '')

          foreach ($name in 'tests', 'coverage') {
              $path = "out/badges/$name.json"
              if (Test-Path -LiteralPath $path) {
                  $badge = ConvertFrom-Json ([System.IO.File]::ReadAllText((Resolve-Path $path)))
                  $summary += ('- **{0}**: {1}' -f $badge.label, $badge.message)
              }
          }

          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($summary -join "`n") + "`n")

      # THE NUMBERS, ON THEIR WAY TO A JOB THAT IS ALLOWED TO QUEUE FOR THE
      # BRANCH. This job used to push them itself, from inside a measurement
      # that takes up to four hours - see the `badges` job below for why that
      # could not stay where it was.
      - name: Upload the badges
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: badges
          path: out/badges/*.json
          if-no-files-found: warn

  # ==========================================================================
  # THE BADGE PUSH, IN A JOB OF ITS OWN, AND THE SPLIT IS THE FIX RATHER THAN
  # THE TIDYING.
  #
  # TWO WRITERS, NO LOCK, NO RETRY. This workflow and ci.yml each carried a
  # verbatim copy of the same forty lines of git: clone the orphan `badges`
  # branch shallow, copy out/badges/*.json in, commit, push. No rebase, no
  # retry, and `throw` on a non-zero exit. So a nightly coverage run overlapping
  # a push to main means one of the two pushes is rejected as non-fast-forward
  # and a build that passed every check it makes reports failure - for a reason
  # that appears nowhere in its own log. It is rare only because 03:00 UTC is a
  # quiet time here, which is not a control.
  #
  # SO EVERY BADGE PUSH NAMES THE SAME CONCURRENCY GROUP and they queue instead.
  # CiLabWorkflow.Tests.ps1 asserts that over the SET of workflow files, so the
  # third writer somebody adds is judged too, and asserts cancel-in-progress is
  # false on all of them: a push cancelled halfway leaves the branch carrying a
  # tests badge from one run and a coverage badge from another.
  #
  # AND IT IS A SEPARATE JOB BECAUSE A GROUP IS HELD FOR THE LENGTH OF WHATEVER
  # HOLDS IT. Put `concurrency: badges` on the measurement job and this workflow
  # owns the badges branch for four hours a night, during which every push to
  # main has a badge run sitting in a queue. The push itself takes seconds; it
  # is the only thing that should be in the group.
  #
  # THE PUSH ITSELF IS .github/actions/publish-badges, ONE PLACE, shared with
  # badges.yml - the two copies had already begun to differ in their comments,
  # and a badge push is exactly the kind of thing where the copy nobody looked
  # at is the one that corrupts the branch.
  # ==========================================================================
