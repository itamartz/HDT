; HDT capture exclusion list  -  DISM /Capture-Image /ConfigFile:
;
; WHAT THIS IS. MDT passes /ConfigFile: on EVERY capture - ZTIBackup.wsf:427
; resolves <DeployRoot>\Tools\<Architecture>\wimscript.ini and quotes it into
; both the /Capture-Image and the /Append-Image branch. Without one, a capture
; swallows the page file, the hibernation file, the volume's shadow-copy store
; and whatever the deployment itself left on the disk, straight into the
; reference image. This file is HDT's version of that list.
;
; WHERE IT LIVES. This copy ships inside the module, at
; Templates\Capture\wimscript.ini, so it travels into every boot image with the
; rest of Templates\ and there is no list of filenames anywhere that could
; disagree with the directory. A share may override it with
; Control\wimscript.ini; the capture step prefers the share's copy when there is
; one and falls back to this. DESIGN 9.3, note 7.
;
; THE SYNTAX IS DISM'S, NOT WINDOWS'. A leading backslash anchors the entry to
; the root of the captured volume - \Windows.old is the one at the top of the
; drive, not any folder of that name anywhere. An entry WITHOUT a leading
; backslash matches by name at any depth. Quotes are required around anything
; containing a space. Nothing here is a wildcard; DISM matches names, not
; patterns.

[ExclusionList]

; -- Windows' own volatile files ------------------------------------------
;
; Gigabytes each, regenerated by the OS on first boot, and meaningless outside
; the machine that wrote them. pagefile.sys and hiberfil.sys alone can double
; the size of a reference image.
pagefile.sys
hiberfil.sys
swapfile.sys
winpepge.sys
$ntfs.log

; The volume's shadow copies and restore points. Capturing them ships every
; earlier state of the reference build inside the image of its final state.
"System Volume Information"

; Deleted-file staging. RECYCLER is the pre-Vista name, $Recycle.Bin the
; current one; a reference build touched by any hand has one or the other.
RECYCLER
$Recycle.Bin

; Offline Files client-side cache. Per-machine, per-user, and Windows refuses
; to let a capture read parts of it anyway.
\Windows\CSC

; The previous installation an in-place upgrade left behind. If a reference
; build was upgraded rather than clean-installed, this is a whole second
; Windows sitting on the volume.
\Windows.old

; -- HDT's own working tree -----------------------------------------------
;
; THIS IS THE ENTRY THAT EXISTS BECAUSE OF HDT, NOT BECAUSE OF WINDOWS, AND IT
; IS THE REASON THIS FILE IS WORTH SHIPPING.
;
; Copy-HDTResumeAgent stages the resume agent to <osvolume>\HDT, and the WinPE
; leg copies its log to <osvolume>\HDT\Logs before restarting. Both are on the
; volume at the moment it is captured, because the capture happens after the
; deployment that put them there.
;
; An image carrying them would carry one machine's deployment state - its
; resume agent, its state.json, its log - onto every machine ever built from
; that image, which is a deployment resuming somebody else's run and looks like
; nothing at all until it does. Excluded as a tree: \HDT takes Logs\ with it.
\HDT

; MDT's equivalents - \MININT and \_SMSTaskSequence - are deliberately NOT
; carried across. HDT has no MDT dependency and never writes either (rule 4);
; listing them would be listing folders that cannot exist.
