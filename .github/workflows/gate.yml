name: CI

# DESIGN 12.2.5: unit + contract + PSScriptAnalyzer on every push, Windows
# runner, a red suite blocks merge.
#
# ONE EDITION, AND IT IS WINDOWS POWERSHELL 5.1. The engine runs inside WinPE,
# which has no pwsh, so 5.1 is the edition that decides whether HDT works - a
# green pwsh leg proves nothing WinPE cares about, and a red one blocks a merge
# over a shell the product never runs under. `shell: powershell` on
# windows-latest IS 5.1.
#
# THE ARGUMENT FOR A SECOND LEG IS ANSWERED IN THE TESTS, NOT IN THE MATRIX.
# A pwsh leg was added back once because two contracts were asleep without it,
# and both are now awake on 5.1 itself:
#
#   - Thirteen suites validated schemas/*.schema.json with Test-Json, which is
#     PowerShell 6+, so each opened with `-Skip:(-not (Get-Command Test-Json))`
#     and vanished whole here. They validate with Test-HDTJsonSchema now - the
#     draft-07 subset schemas/ uses, hand-written for 5.1, which THROWS on a
#     keyword it does not implement rather than ignoring one. 383 contract
#     assertions that used to skip on this runner now execute on it.
#   - PowerShell51Compatibility.Contract needed 7 only if you believed a
#     forbidden operator has to parse to be detected. It does not: `??` and the
#     ternary are PARSE ERRORS under 5.1, and Get-HDTScriptCompatibilityViolation
#     reports a parse error as a violation. 5.1 is the STRONGER engine for that
#     contract, not the weaker one - it is the edition on which a 7-ism cannot
#     even be read.
#
# So a second leg would now test a configuration this product does not support,
# and it has already cost a red build over PSUseSingularNouns - an analyzer rule
# difference between the editions with no bearing on the engine.
#
# THE REPORTS ARE BUILT BY build.ps1, NOT BY THIS FILE. The test task writes the
# NUnit result and the shields.io tests badge; the runner only uploads and
# pushes them. CI never grows its own private build logic, so anybody can
# reproduce what the badge says by running the same line locally.
#
# COVERAGE IS NOT HERE. Measured, it turns a 10 minute suite into a 98 minute
# one on a developer machine - Pester traces every command 8000 tests execute -
# which on this runner is a multi-hour job in front of every push. It lives in
# coverage.yml, nightly, where nobody is waiting for it.
#
# AND main IS ci-lab.yml's: a push to main runs THE SAME ./build.ps1 -Task ci on
# GHRUNNER01 - a machine that has been used, with an ADK on it and a
# PSModulePath somebody else's product wrote into, which is the shape of machine
# HDT is actually installed onto. A clean container answers a different
# question, and this file is still the one that answers it: on every pull
# request, and once a week.
#
# THE WEEKLY schedule IS NOT DECORATION, IT IS THE ONLY THING LEFT THAT PROVES
# THE CLEAN-MACHINE INSTALL. What this workflow uniquely tests is the
# `Install build dependencies` step above it - NuGet bootstrapped, three modules
# pulled from the Gallery at their pinned versions, onto an image with none of
# them. With `push:` gone, that leg would run only when somebody opens a pull
# request, and in the sixty runs before this file was split, ZERO were
# pull_request events. A leg that never fires proves nothing, and the way it
# fails is silent: the Gallery yanks a version, or GitHub's image stops shipping
# a prerequisite, and nobody finds out until the next contributor's first PR.

on:
  # NO `push:`, AND ITS ABSENCE IS A DECISION. A push to main runs the same
  # ./build.ps1 -Task ci on GHRUNNER01 via ci-lab.yml; this file firing on it as
  # well would be the same suite twice for one commit, and the hosted one would
  # be the copy people stopped reading. There was a transitional `push:` here
  # while nothing answered to ci-lab.yml's `hdt-ci` label - GHRUNNER01-ci does
  # now, and CI-Lab has gone green on main - and CiWorkflow.Tests.ps1 asserts
  # both that it is gone and that no note describing it was left behind.
  pull_request:
  workflow_dispatch:

  # 05:00 UTC on Mondays. After coverage.yml's 03:00 nightly rather than beside
  # it, so the two are not competing for a runner and reporting each other's
  # slowness.
  schedule:
    - cron: '0 5 * * 1'

  # AND FROM publish.yml, SO A RELEASE RUNS THE GATE RATHER THAN ASSUMING IT.
  # A tag used to reach the PowerShell Gallery on the strength of "the commit
  # it points at passed CI on main". That holds until the tag names an older
  # commit, or is pushed while the branch's own run is still going, or names a
  # commit that reached main by a route that did not run this. In each of
  # those the release path spent ninety minutes of the lab host and a human's
  # approval click before finding a lint failure.
  #
  # CALLED, NOT COPIED, for the same reason as e2e.yml: the release runs the
  # IDENTICAL gate the branch does, on the same edition and the same dependency
  # pins, and a change to either reaches both callers or neither.
  #
  # THE BADGES CANNOT MOVE WHEN IT IS CALLED, AND THAT USED TO NEED AN
  # ARGUMENT. A called workflow sees the CALLER's github context, so on a
  # release `github.event_name` was genuinely 'push' and the badge step's guard
  # rested entirely on `github.ref` being refs/tags/v* rather than
  # refs/heads/main. It held, and it was one condition deep.
  #
  # THERE IS NO BADGE STEP IN THIS FILE ANY MORE, so a release cannot race the
  # branch's own run for the badges branch whatever the context says. The write
  # is badges.yml's, on `workflow_run` after ci-lab.yml.
  workflow_call:

# READ, AND IT USED TO BE WRITE. This workflow pushed the badges branch itself,
# which meant a workflow that runs on `pull_request` declared contents: write at
# workflow level - harmless in practice, because GitHub hands a fork's pull
# request a read-only token whatever the file asks for, and one line of YAML
# away from not being harmless the day somebody adds pull_request_target.
#
# THE BADGES ARE badges.yml's NOW, on `workflow_run` after ci-lab.yml, where the
# write is on the default branch's copy of a file no pull request can edit.
# Nothing in this file writes anything.
permissions:
  contents: read

jobs:
  windows:
    name: powershell
    runs-on: windows-latest

    # The suite is ~10 minutes on a developer machine and ~20 here. GitHub's
    # default is 360, so without this a hung DISM or a wedged Pester runner
    # burns six hours of runner time in front of every push queued behind it.
    # 45 catches a hang without tripping on a slow runner.
    timeout-minutes: 45

    # Set once and inherited by every `run:` step. It lives on defaults.run
    # rather than on each step because a step-level `shell:` key cannot read a
    # matrix context - GitHub rejects the whole workflow with "Unrecognized
    # named-value: 'matrix'" and produces a run with zero jobs - and that is
    # worth leaving written down now that there is no matrix to read.
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # Install-PackageProvider -Name NuGet is a Windows PowerShell 5.1
          # bootstrap, and 5.1 is the only edition this workflow runs.
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester            -RequiredVersion 5.7.1  -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer  -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module powershell-yaml   -RequiredVersion 0.4.12 -Scope CurrentUser -Force

          "$($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion): dependencies installed"

      - name: Build, lint, test, self-check
        run: ./build.ps1 -Task ci

      # AND IT CANNOT FAIL THE RUN. Run 34250900149 built, linted, tested and
      # self-checked clean - 15693 passed, the badge pushed brightgreen - and
      # reported failure, because upload-artifact got HTTP 403 from GitHub's
      # artifact service while finalising. The bytes were already up; only the
      # finalise handshake was refused, the action calls a 403 non-retryable and
      # exits 1, and one optional copy of a report sank the whole gate. The
      # identical step, name and path had succeeded four hours earlier.
      #
      # THE VERDICT IS build.ps1's. What goes up here is a convenience copy of
      # numbers the run already states twice over - the step summary below and
      # the badge, both written before it. Storage refusing to take that file
      # says nothing about whether HDT works, and it is not worth a merge.
      #
      # continue-on-error IS NOT if-no-files-found, which is already `warn`: a
      # missing report has never failed this step, so the only thing tolerated
      # here is the service refusing a file that exists. The step still shows
      # red on the run page - the failure stays visible, it just stops voting.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pester-powershell
          path: out/testResults/*.xml

      # The two numbers on the run's own summary page, so a failure does not
      # have to be read out of twenty thousand lines of Pester output.
      - name: Summarise the run
        if: always()
        run: |
          $summary = @('## HDT build', '')

          foreach ($name in 'tests') {
              $path = "out/badges/$name.json"
              if (Test-Path -LiteralPath $path) {
                  $badge = ConvertFrom-Json ([System.IO.File]::ReadAllText((Resolve-Path $path)))
                  $summary += ('- **{0}**: {1}' -f $badge.label, $badge.message)
              }
          }

          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($summary -join "`n") + "`n")

      # NO BADGE PUSH HERE ANY MORE, AND ITS ABSENCE IS THE POINT.
      #
      # This workflow used to end with forty lines of git that cloned the orphan
      # `badges` branch, copied out/badges/*.json into it and pushed - guarded by
      # `github.event_name == 'push' && github.ref == 'refs/heads/main'`.
      #
      # THAT GUARD IS UNSATISFIABLE NOW - there is no `push:` here to satisfy it
      # - AND THAT IS NOT THE REASON IT MAY NOT COME BACK. It was satisfiable
      # again for a week, while a stand-in `push:` covered for a runner that
      # did not exist yet, and the step still did not return: this file also runs
      # on `pull_request`, where declaring contents: write at workflow level is
      # one careless `pull_request_target` away from being a real hole, and that
      # reason stands on its own whatever the triggers say.
      #
      # THE NUMBERS COME FROM THE LAB MACHINE NOW. ci-lab.yml runs the same task
      # on every push to main and uploads out/badges/*.json as an artifact;
      # badges.yml downloads it and does the write, on a hosted runner, from the
      # default branch's copy of a file no pull request can edit.
      #
      # AND coverage.yml HAD AN IDENTICAL COPY OF THOSE FORTY LINES, which is
      # how the two came to race each other on a branch neither of them locked.
      # The push is one composite action now - .github/actions/publish-badges -
      # and every job that calls it shares a `badges` concurrency group.

  # ==========================================================================
  # COVERAGE, WHICH WAS coverage.yml AND IS A JOB HERE FOR ONE REASON.
  #
  # IT BELONGS TO THE SAME PRIVILEGE CLASS AS THE GATE ABOVE: a hosted runner,
  # contents: read, nothing a pull request could steal by editing this file.
  # That - not subject matter - is what decides which file a job lives in, and
  # it is why e2e and the lab gate are NOT here: they run on a machine on a
  # private LAN, and a file carrying `pull_request` runs from the pull
  # request's own head.
  #
  # IT IS STILL SLOW AND STILL SCHEDULED. Pester traces every command the suite
  # executes; the last two runs took 1h4m and 1h5m. The `if:` below keeps it off
  # every other trigger this file answers.
  # ==========================================================================
  coverage:
    name: coverage

    # NEVER ON A PULL REQUEST. Four hours of a hosted runner is not a thing a
    # PR should be able to start, and the number it produces is about main
    # rather than about a proposal. Its own file used to express this by having
    # no pull_request trigger; in a shared file it is an `if:`, and that is
    # safe HERE - unlike a guard on a self-hosted job - because this file holds
    # nothing a fork could want. It runs on windows-latest with contents: read,
    # which is what a fork already gets.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    # The suite takes 20 minutes here without coverage. This one is allowed to
    # take two hours, and is killed rather than left burning if it takes six.
    timeout-minutes: 240

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester            -RequiredVersion 5.7.1  -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module powershell-yaml   -RequiredVersion 0.4.12 -Scope CurrentUser -Force

          "$($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion): dependencies installed"

      - name: Test with coverage
        run: ./build.ps1 -Task test -Coverage -Verbosity None

      # continue-on-error on both, for the reason ci.yml's upload step spells
      # out: a 403 from GitHub's artifact storage is not a verdict on the code,
      # and a diagnostic copy does not get to fail the run that produced it.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-jacoco
          path: out/coverage/coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pester-coverage-run
          path: out/testResults/*.xml

      - name: Summarise the run
        if: always()
        run: |
          $summary = @('## HDT coverage', '')

          foreach ($name in 'tests', 'coverage') {
              $path = "out/badges/$name.json"
              if (Test-Path -LiteralPath $path) {
                  $badge = ConvertFrom-Json ([System.IO.File]::ReadAllText((Resolve-Path $path)))
                  $summary += ('- **{0}**: {1}' -f $badge.label, $badge.message)
              }
          }

          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($summary -join "`n") + "`n")

      # THE NUMBERS, ON THEIR WAY TO A JOB THAT IS ALLOWED TO QUEUE FOR THE
      # BRANCH. This job used to push them itself, from inside a measurement
      # that takes up to four hours - see the `badges` job below for why that
      # could not stay where it was.
      - name: Upload the badges
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: badges
          path: out/badges/*.json
          if-no-files-found: warn

  # ==========================================================================
  # THE BADGE PUSH, IN A JOB OF ITS OWN, AND THE SPLIT IS THE FIX RATHER THAN
  # THE TIDYING.
  #
  # TWO WRITERS, NO LOCK, NO RETRY. This workflow and ci.yml each carried a
  # verbatim copy of the same forty lines of git: clone the orphan `badges`
  # branch shallow, copy out/badges/*.json in, commit, push. No rebase, no
  # retry, and `throw` on a non-zero exit. So a nightly coverage run overlapping
  # a push to main means one of the two pushes is rejected as non-fast-forward
  # and a build that passed every check it makes reports failure - for a reason
  # that appears nowhere in its own log. It is rare only because 03:00 UTC is a
  # quiet time here, which is not a control.
  #
  # SO EVERY BADGE PUSH NAMES THE SAME CONCURRENCY GROUP and they queue instead.
  # CiLabWorkflow.Tests.ps1 asserts that over the SET of workflow files, so the
  # third writer somebody adds is judged too, and asserts cancel-in-progress is
  # false on all of them: a push cancelled halfway leaves the branch carrying a
  # tests badge from one run and a coverage badge from another.
  #
  # AND IT IS A SEPARATE JOB BECAUSE A GROUP IS HELD FOR THE LENGTH OF WHATEVER
  # HOLDS IT. Put `concurrency: badges` on the measurement job and this workflow
  # owns the badges branch for four hours a night, during which every push to
  # main has a badge run sitting in a queue. The push itself takes seconds; it
  # is the only thing that should be in the group.
  #
  # THE PUSH ITSELF IS .github/actions/publish-badges, ONE PLACE, shared with
  # badges.yml - the two copies had already begun to differ in their comments,
  # and a badge push is exactly the kind of thing where the copy nobody looked
  # at is the one that corrupts the branch.
  # ==========================================================================
