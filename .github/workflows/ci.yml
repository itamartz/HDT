name: CI

# DESIGN 12.2.5: unit + contract + PSScriptAnalyzer on every push, Windows
# runner, a red suite blocks merge.
#
# shell: powershell on windows-latest IS Windows PowerShell 5.1. Running the
# matrix over both shells is what makes the "engine must run in WinPE" constraint
# enforced rather than aspirational.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      # Both editions always report. Failing fast would hide a 5.1-only break
      # behind a pwsh-only break, or the other way round.
      fail-fast: false
      matrix:
        shell: [ pwsh, powershell ]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: ${{ matrix.shell }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester            -RequiredVersion 5.7.1  -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer  -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module powershell-yaml   -RequiredVersion 0.4.12 -Scope CurrentUser -Force

      - name: Build, lint, test, self-check
        shell: ${{ matrix.shell }}
        run: ./build.ps1 -Task ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-${{ matrix.shell }}
          path: out/testResults/*.xml
