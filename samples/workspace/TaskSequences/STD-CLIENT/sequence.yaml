# DESIGN 4.1's sequence, as an administrator would actually write it.
#
# EVERY STEP TYPE IN THIS FILE IS BUILT. That was not true when it was written:
# ApplyDrivers, JoinDomain and WindowsUpdate were all unbuilt then. WindowsUpdate
# was deferred out of v1 on 2026-08-16 and built on 2026-09-06, once a real WSUS
# server existed in the lab; until then it sat commented out here rather than
# left to fail forever. It now runs TWICE - see the State Restore group.
#
# ONE STEP IS STILL COMMENTED OUT AND THAT IS NOT ABOUT WHETHER IT EXISTS.
# JoinDomain is built and runnable; it needs a reachable domain controller,
# which HDT's isolated test switch deliberately does not have (PROJECT.md), so
# the sample ships as a workgroup build and that step is the line you uncomment.
#
# Validate, DiskPartition, ApplyImage, ApplyUnattend and ConfigureBoot ARE now
# runnable, alongside Restart, PowerShell, CommandLine, SetVariable and NoOp.
# See TaskSequences/DEMO-M3 for the WinPE half of a real deployment that runs end
# to end against fakes, and DEMO-M2 for the sequencing, retry and reboot half.
#
# Three corrections against DESIGN 4.1 as printed:
#
#   1. Every variable is HDT-prefixed (DESIGN 3.2). 'OSImage' is not a
#      deployment variable name; 'HDTOSImage' is.
#   2. The State Restore condition reads '"%_HDTPhase%" == "FullOS"'. The phase
#      variable takes the values WinPE and FullOS (DESIGN 4.4.1), so "OS" never
#      matched anything - and the condition is a SINGLE-quoted YAML scalar,
#      because the grammar itself carries double quotes.
#   3. The domain join is commented out and a workgroup build is the default,
#      because HDT's lab switch is isolated from the domain controller by design
#      (PROJECT.md). Uncomment it when you have a reachable DC.

schemaVersion: 1
id: STD-CLIENT
name: Standard Windows 11 Client
description: Bare-metal client build - the DESIGN 4.1 reference sequence
variables:
  HDTOSImage: Win11-24H2-Ent
  HDTDiskLayout: uefi-standard
  HDTJoinWorkgroup: WORKGROUP

steps:
  - group: Preinstall
    runIn: WinPE
    steps:
      - name: Validate
        type: Validate
        minRamMB: 4096
        minDiskGB: 60

      - name: Format and Partition
        type: DiskPartition
        layout: "%HDTDiskLayout%"
        wipe: true

  - group: Install
    runIn: WinPE
    steps:
      - name: Apply OS
        type: ApplyImage
        os: "%HDTOSImage%"
        index: 1
        target: primary
        timeoutMinutes: 60

      - name: Inject Drivers
        type: ApplyDrivers
        group: "%HDTDriverGroup%"
        fallback: match-pnp        # index lookup if no group matches

      - name: Apply Unattend
        type: ApplyUnattend
        template: unattend.xml

      - name: Prepare Boot
        type: ConfigureBoot

      - name: Reboot Into Windows
        type: Restart

  - group: State Restore
    condition: '"%_HDTPhase%" == "FullOS"'
    steps:
      # Domain join needs a reachable domain controller. HDT's test lab switch
      # is deliberately isolated from one (PROJECT.md), so the sample ships as a
      # workgroup build and this step is the line you uncomment.
      #
      # - name: Join Domain
      #   type: JoinDomain
      #   domain: "%HDTJoinDomain%"
      #   ou: "%HDTMachineObjectOU%"
      #   continueOnError: false
      #   retry:
      #     count: 2
      #     delaySeconds: 30
      #     backoff: exponential

      # TWICE, AND THE ORDER IS THE POINT (DESIGN 10.1). The first pass patches
      # the base image so an installer meets a current machine; the second
      # catches the updatable components an install pulled in - .NET, the VC
      # runtimes, a driver an application shipped. Two passes both after the
      # applications would be two of the second one.
      #
      # THE NAMES ARE MDT'S OWN for its two instances of this step. Workbench's
      # Client task sequence carries "Windows Update (Pre-Application
      # Installation)" and "(Post-Application Installation)", and an
      # administrator arriving from there is looking for those words.
      #
      # continueOnError: true because Windows Update is the least predictable
      # thing in a sequence - a server mid-sync, an update superseded this
      # morning, a download that timed out. None of those is a reason to abandon
      # a deployment that has already imaged and configured the machine.
      - name: Windows Update (Pre-Application Installation)
        type: WindowsUpdate
        runIn: FullOS
        server: "%HDTWSUSServer%"
        categories: [SecurityUpdates, CriticalUpdates, UpdateRollups]
        maxPasses: 3
        continueOnError: true
        timeoutMinutes: 120

      - name: Install Applications
        type: InstallApplications
        selection: "%HDTApplications%"

      - name: Windows Update (Post-Application Installation)
        type: WindowsUpdate
        runIn: FullOS
        server: "%HDTWSUSServer%"
        categories: [SecurityUpdates, CriticalUpdates, UpdateRollups]
        maxPasses: 3
        continueOnError: true
        timeoutMinutes: 120

      - name: Corporate Baseline
        type: PowerShell
        script: Scripts\Set-CorpBaseline.ps1
        runIn: FullOS
        log: CorpBaseline.log
