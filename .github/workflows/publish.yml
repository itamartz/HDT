name: Publish

# THE POWERSHELL GALLERY, AND ONLY WHEN SOMEBODY ASKS.
#
# A published version cannot be replaced and cannot really be withdrawn: Unlist
# hides it from search and leaves it installable by exact version for ever. So
# this runs on a tag or on a human pressing Run workflow, and never on a push to
# a branch. `Install-Module Hephaestus` is a promise, and the first version that
# keeps it badly is the one everybody has.
#
# IT SHIPS WHAT THE BUILD STAGED. out/Hephaestus/<version> is what
# Invoke-HDTBuild produced, with the manifest's exports checked against the
# module's own - the source tree has tests, fixtures and .planning beside it.
#
# THE SUITE RUNS FIRST. An unpublishable build is a bad afternoon; a published
# broken one is somebody else's.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      whatIf:
        description: 'Dry run: build and validate, but do not publish'
        type: boolean
        default: true

permissions:
  contents: write        # gh release create is a repository write; there is no narrower scope for it.

jobs:

  # ==========================================================================
  # preflight -> ci -> lab -> publish, AND THE ORDER IS THE POINT OF THIS FILE.
  #
  # Until v0.24.0 a `v*` tag ran clean,bundle,build,lint,test,selfcheck on a
  # hosted runner and went straight to the PowerShell Gallery. tests/e2e - the
  # only suite that proves HDT can deploy a machine at all - was not in that
  # path. It ran on a Sunday cron, and a release never waited for it.
  #
  # THE CHAIN IS ORDERED BY WHAT IT COSTS TO FIND OUT SOMETHING IS WRONG.
  #
  # preflight  the two questions answerable in a minute that building cannot
  #            change: does the tag match the manifest, and does the Gallery
  #            already hold this version. A tag that disagrees with the
  #            manifest must not burn an hour and a half of somebody's Hyper-V
  #            host before saying so.
  #
  # ci         ci.yml, CALLED rather than copied - the same gate the branch
  #            runs, on the same edition, on hosted runners, on this exact
  #            commit.
  #            "The tagged commit already passed CI on main" is true right up
  #            until it is not: a tag on an older commit, a tag pushed while
  #            the branch's own run is still going, a commit that reached main
  #            by a route that did not run CI. In each of those the shape
  #            without this job spent the lab FIRST and found the lint
  #            failure afterwards.
  #
  # lab        e2e.yml, also called. Runs on GHRUNNER01, an hour and a half of
  #            somebody's Hyper-V host, behind e2e.yml's own guard: it starts
  #            only when the repository owner started the run, and fails on a
  #            hosted runner for anybody else. It used to sit behind the `lab`
  #            environment's required reviewer as well, which meant a release
  #            stopped and waited for a click from the person who had just
  #            pushed the tag. The guard answers the same question without
  #            anybody having to be awake for it.
  #
  # publish    stages the artefact, then the Gallery, then the Release. It
  #            `needs` both gates and carries no `if:` of its own - which is
  #            what makes them unbypassable. A job that needs another runs
  #            only when that one SUCCEEDED; add always() and "the gates
  #            passed" silently becomes "the gates finished, or were
  #            cancelled, or never ran". PublishWorkflow.Tests.ps1 fails the
  #            file on always() here, and on an `if:` on either gate.
  # ==========================================================================

  preflight:
    name: tag and gallery
    runs-on: windows-latest

    # Two manifest reads and one Find-Module. If this is still going at ten
    # minutes, the Gallery is not answering, and the release should say so now
    # rather than after the lab has run.
    timeout-minutes: 10

    # Nothing here writes. The write this workflow needs is for `gh release
    # create`, and it belongs to the job that makes the Release.
    permissions:
      contents: read

    # THE GALLERY ANSWER HAS TO OUTLIVE THIS JOB. It used to be read as
    # steps.gallery.outputs.published by two later steps in the same job;
    # those steps are now in a different job, so it is published as a job
    # output and read as needs.preflight.outputs.published.
    outputs:
      published: ${{ steps.gallery.outputs.published }}

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      # THE VERSION IS THE TAG, OR THE TAG IS WRONG. A tag that does not match
      # the manifest publishes a version nobody asked for and leaves the
      # repository disagreeing with the Gallery about what v1.2.3 is.
      - name: Check the tag against the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $manifest = Import-PowerShellDataFile './src/Hephaestus/Hephaestus.psd1'
          $tagged = "$env:GITHUB_REF_NAME".TrimStart('v')

          if ($tagged -ne [string] $manifest.ModuleVersion) {
              throw ("the tag says $tagged and Hephaestus.psd1 says $($manifest.ModuleVersion). " +
                  'Tag the commit that carries the version you mean to publish.')
          }

          "publishing version $tagged"

      # A VERSION THE GALLERY ALREADY HAS CANNOT BE REPUBLISHED, and that is as
      # true before the build as after it. It used to be discovered on the last
      # line of the last step, twenty-one minutes in, when the only remedy left
      # was to raise the manifest and run the whole thing again. Neither the
      # manifest nor the Gallery is changed by building, so there is nothing to
      # learn by waiting for the build first.
      #
      # IT SKIPS THE PUBLISH RATHER THAN FAILING THE RUN. A tag is also how a
      # release is RECORDED - it is what makes the repository able to say which
      # commit a published version came from - and a version already on the
      # Gallery must not make tagging that commit impossible. So the check says
      # so, loudly, and the run goes on to build and validate; only the step
      # that would upload is skipped. There is nothing wrong here to fail on:
      # the Gallery already holds what this tag names.
      #
      # NOT ON A DRY RUN. -WhatIf never reaches the Gallery, so rehearsing the
      # version that is already published is a reasonable thing to ask for.
      - name: Check the version against the Gallery
        id: gallery
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.whatIf) }}
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Import-PowerShellDataFile './src/Hephaestus/Hephaestus.psd1'
          $version = [string] $manifest.ModuleVersion

          $already = Find-Module -Name Hephaestus -RequiredVersion $version -Repository PSGallery -ErrorAction SilentlyContinue

          if ($already) {
              "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

              $said = ("the Gallery already has Hephaestus $version, and a published version cannot be " +
                  'replaced. This run will build and validate; it will publish nothing. To ship new ' +
                  'code, raise ModuleVersion with ./build.ps1 -Task version, commit, and tag that commit.')

              Write-Warning $said
              $said | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

              exit 0
          }

          "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "the Gallery does not have $version yet"

      # A RUN THAT SITS THERE WITH NO EXPLANATION LOOKS BROKEN. The next job is
      # an hour and a half of VM time on a machine in somebody's house, and
      # before that it may be queued waiting for that machine to exist at all.
      # Somebody who tagged a release and came back to a still-running run
      # needs to be told which of those it is doing.
      #
      # IT NO LONGER WAITS FOR A CLICK. This used to say the run was blocked on
      # the `lab` environment's required reviewer; that environment is gone
      # from e2e.yml, replaced by an owner guard that answers the same question
      # without asking the person who pushed the tag to approve their own
      # release. Saying otherwise would send them hunting for a button.
      - name: Say what happens next
        run: |
          $lines = @(
              '## What this run does next'
              ''
              '1. **Lab (end-to-end)** - `e2e.yml` on the self-hosted runner GHRUNNER01: it builds a boot image, creates Hyper-V VMs and deploys Windows to them. Expect roughly ninety minutes.'
              '2. **Publish** - the full build and suite, then the Gallery, then the Release. Only if the lab job succeeds.'
              ''
              '**Nothing here waits for a human.** `e2e.yml` checks that the run was started by the repository owner and then goes; there is no button to press on this page.'
              ''
              'If GHRUNNER01 is switched off the lab job stays queued and GitHub cancels it after 24 hours; the release then fails rather than publishing something no lab ever ran.'
          )

          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($lines -join "`n") + "`n")

          $lines -join "`n"

  # THE GATE, AND IT IS ci.yml ITSELF. Same argument as the lab below: one
  # definition, two callers. A copy of the edition, the dependency pins and the
  # build invocation would be a second source of truth, and the branch's copy
  # would be the one still green after somebody fixed the release's.
  #
  # NO `if:` ON THIS JOB, EVER - see the note on the lab job.
  #
  # contents: read, AND IT USED TO BE write. ci.yml declared write at workflow
  # level because it pushed the badges branch itself, and a called workflow may
  # not ask for more than the calling job grants - so this job had to hand it
  # write, and what stopped a release touching the badges was a REF comparison
  # inside the badge step.
  #
  # THE BADGE STEP IS GONE FROM ci.yml. It is badges.yml's write now, on
  # `workflow_run` after ci-lab.yml, and ci.yml declares contents: read. So the
  # gate on the release path runs with a read-only token and the ref comparison
  # is not load-bearing any more - there is nothing left in that workflow for it
  # to guard.
  #
  # ./build.ps1 -Task ci RUNS version, WHICH REWRITES ModuleVersion - the
  # v0.4.0 defect, where a bump between the tag check and the upload put 0.5.0
  # on the Gallery under a tag reading 0.4.0. It is harmless HERE and only
  # here: a job gets its own runner and its own checkout, so the bump lands in
  # a tree that is thrown away, and the publish job below reads the manifest at
  # the tag. Move these steps into that job and the defect comes back.
  ci:
    name: gate
    needs: preflight
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read

  # THE LAB, AND IT IS e2e.yml ITSELF. Rule 8 applied to CI: one definition,
  # two callers. A workflow_dispatch of e2e.yml and this both run the same job,
  # so a fix to the runner's dependency checks reaches both or neither.
  #
  # NO `if:` ON THIS JOB, EVER. An `if:` here is the bypass - a condition that
  # evaluates false skips the job, and GitHub then skips everything that needs
  # it, so a mistyped guard would not fail the release, it would publish
  # without a lab run. That includes the dry-run path: a rehearsal that skips
  # the thing being rehearsed is not a rehearsal.
  #
  # READ, AND NO SECRETS. This job runs on a machine in somebody's lab. It has
  # no use for the token that creates Releases or for PSGALLERY_API_KEY, so it
  # is handed neither. `secrets:` is absent rather than `inherit`.
  #
  # 180 MINUTES, NOT THE 360 A HAND-STARTED RUN GETS. Four of the nine e2e suites skip on
  # GHRUNNER01 for want of the 50 GB share, so what actually runs there is
  # roughly ninety minutes of VM time. Three hours is double that and still
  # half of what the Sunday run is allowed, because a release nobody can ship
  # gets worse the longer it takes to find out. It bounds EXECUTION, not the
  # wait for a runner - see the note on timeout-minutes in e2e.yml.
  #
  # THE HOURLY CHECKPOINT REVERT DOES NOT REACH IT. MS-A2 rolls GHRUNNER01
  # back to its `clean` checkpoint every hour, and that task skips while
  # Runner.Worker.exe exists in the guest (PROJECT.md, "GHRUNNER01"). A job
  # longer than an hour is therefore not at risk of being reverted underneath
  # itself; the reverts happen in the gaps between jobs.
  lab:
    name: end-to-end
    needs: ci
    uses: ./.github/workflows/lab.yml
    permissions:
      contents: read
    with:
      timeoutMinutes: 180

  publish:
    name: powershell gallery
    needs: [preflight, ci, lab]
    runs-on: windows-latest

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester            -RequiredVersion 5.7.1  -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer  -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module powershell-yaml   -RequiredVersion 0.4.12 -Scope CurrentUser -Force

          "$($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion): dependencies installed"

      # EVERY ci TASK EXCEPT version, AND THAT IS THE WHOLE POINT. The version
      # task REWRITES ModuleVersion in the manifest when the sources have moved
      # since the last recorded bump - it is a source edit somebody makes and
      # commits, not something a release does to itself.
      #
      # ./build.ps1 -Task ci HERE PUBLISHED THE WRONG VERSION. v0.4.0 checked
      # green against a manifest reading 0.4.0, ci then bumped it to 0.5.0, and
      # the step below re-read the bumped manifest and put 0.5.0 on the Gallery
      # under a tag that says 0.4.0. The guard above cannot catch what runs
      # AFTER it, so what runs after it must not move the number.
      #
      # BUMP IT BEFORE YOU TAG: ./build.ps1 -Task version, commit the manifest,
      # tag that commit.
      # STAGES THE ARTEFACT. IT IS NO LONGER THE GATE - the ci job is, on this
      # same commit, on the edition HDT supports, minutes earlier.
      #
      # WHAT SURVIVED. bundle and build are not verification, they are how
      # out/Hephaestus/<version> comes to exist at all - and build carries the
      # only checks that look at the PACKAGE rather than the sources:
      # Test-ModuleManifest, FunctionsToExport compared against what the module
      # really exports, and a refusal if Hephaestus.bundle.ps1 was not staged
      # (a package with neither the bundle nor the sources imports nothing, and
      # the Gallery keeps a published version for ever). clean is there so the
      # stage cannot inherit anything from an earlier run.
      #
      # WHAT WENT, AND WHY. lint, test and selfcheck all run in the ci job and
      # none of them reads the staged folder: lint analyses src/, test runs
      # tests/unit and tests/contract, and selfcheck watches a deliberately
      # failing test fail - it proves the harness, not the package. Running
      # them again here was twenty minutes per release buying a second opinion
      # from the same code about the same commit.
      #
      # STILL NOT version, AND STILL NOT ci. Both move ModuleVersion, and this
      # is the job whose manifest the upload below re-reads.
      - name: Stage the module
        run: ./build.ps1 -Task clean,bundle,build

      # SKIPPED WHEN THE GALLERY ALREADY HAS THIS VERSION, and only then. The
      # output is empty on a dry run - that step does not run at all there - so
      # the comparison has to be against 'false' rather than for 'true'. It is
      # read from the preflight JOB now, because the check that produces it
      # runs in front of the lab rather than in this job.
      - name: Publish to the PowerShell Gallery
        if: needs.preflight.outputs.published != 'false'
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Import-PowerShellDataFile './src/Hephaestus/Hephaestus.psd1'
          $staged = "out/Hephaestus/$($manifest.ModuleVersion)"

          if (-not (Test-Path -LiteralPath $staged)) {
              throw "the build staged nothing at '$staged'. ./build.ps1 -Task bundle,build is what puts it there."
          }

          # WHAT IS ABOUT TO BE PUBLISHED IS THE STAGED MANIFEST, not the one
          # checked at the top of this run - Publish-Module reads the version
          # out of the folder it is handed. So the tag is checked against THAT,
          # last thing, where nothing else can move it afterwards. Belt as well
          # as braces: the step above no longer bumps, and this is what would
          # have caught it when it did.
          if ("$env:GITHUB_REF_NAME".StartsWith('v') -and '${{ github.event_name }}' -eq 'push') {
              $stagedVersion = [string] (Import-PowerShellDataFile "$staged/Hephaestus.psd1").ModuleVersion
              $tagged = "$env:GITHUB_REF_NAME".TrimStart('v')

              if ($stagedVersion -ne $tagged) {
                  throw ("the tag says $tagged and the build staged $stagedVersion. Nothing between the " +
                      'checkout and here may change ModuleVersion - publishing now would put a version on ' +
                      'the Gallery that no tag in this repository names.')
              }
          }

          # NAMED, NOT DISCOVERED IN A NuGet ERROR. Without this the run fails
          # inside Publish-Module with a message about an anonymous request,
          # which sends somebody reading NuGet documentation rather than adding
          # a repository secret.
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
              throw ('PSGALLERY_API_KEY is not set on this repository. Create an API key at ' +
                  'https://www.powershellgallery.com/account/apikeys and add it under ' +
                  'Settings > Secrets and variables > Actions.')
          }

          # THE DRY RUN IS THE DEFAULT ON THE MANUAL PATH, so pressing Run
          # workflow to see whether it would work cannot publish by accident. A
          # tag is the deliberate act, and publishes.
          $dryRun = ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.whatIf }}' -eq 'true')

          if ($dryRun) {
              Publish-Module -Path $staged -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -WhatIf -Verbose
              "dry run only - nothing was published"
              exit 0
          }

          Publish-Module -Path $staged -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -Verbose

          "published Hephaestus $($manifest.ModuleVersion)"

      # v0.13.0 THROUGH v0.19.0 ALL SHIPPED WITH NO RELEASE BEHIND THEM. Every
      # one published to the Gallery correctly; none of them got a Release
      # page, because nothing in this file ever asked for one. v0.12.0 has one
      # only because somebody ran `gh release create` by hand, once.
      #
      # SAME GUARD AS THE GALLERY PUBLISH, so the two cannot drift: a dry run
      # (workflow_dispatch) and a version the Gallery already has both leave
      # needs.preflight.outputs.published as anything but the string 'false' is
      # wrong to read here too, and a Release that appeared for a publish that
      # did not happen is worse than one that is late.
      #
      # --generate-notes RATHER THAN A HAND-WRITTEN BODY: GitHub diffs this tag
      # against the previous Release and lists the commits, which is accurate
      # by construction and needs nothing added here when the commit style
      # changes.
      - name: Create a GitHub Release
        if: github.event_name == 'push' && needs.preflight.outputs.published != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Import-PowerShellDataFile './src/Hephaestus/Hephaestus.psd1'

          gh release create $env:GITHUB_REF_NAME `
              --title "Hephaestus $($manifest.ModuleVersion)" `
              --generate-notes

          "created the GitHub Release for $env:GITHUB_REF_NAME"
