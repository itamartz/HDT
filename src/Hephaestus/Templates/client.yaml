# HDT STANDARD CLIENT TASK SEQUENCE
#
# The equivalent of MDT's Templates\Client.xml, which is what its New Task
# Sequence wizard copies into a new sequence's Control folder. This is the same
# idea in the same shape: a real sequence.yaml, readable and editable before it
# is ever used, rather than lines generated by code nobody can look at.
#
# THE PHASES ARE MDT'S, AND THE ORDER IS LOAD-BEARING. Initialization,
# Validation, Preinstall, Install, Postinstall, State Restore - a technician
# arriving from Workbench already knows which half of a deployment a failure
# happened in from the group it stopped inside, and that is worth more than any
# rearrangement HDT might prefer.
#
# WHAT IS NOT HERE IS NOT AN OVERSIGHT. MDT's Client.xml also carries State
# Capture, USMT offline capture, sysprep-and-capture and BitLocker offline -
# HDT has none of those yet, and a template that named steps the engine cannot
# run would produce a sequence that fails on the machine instead of in the
# editor. Groups are left in place where the work belongs so there is somewhere
# obvious to put it.
#
# THE TWO PARTITION STEPS ARE MDT'S PAIR. A GPT disk on a BIOS machine fails
# after the image has been applied - late, expensively, and with a machine that
# looks deployed until it is restarted - so one sequence carries both and the
# firmware picks.
#
# %Variable% AND $Variable ARE THE SAME THING to the engine. This file uses the
# PowerShell spelling in conditions, because that is what the hands of everyone
# editing it produce, and %Name% inside quoted values, because that is
# substitution rather than comparison.

schemaVersion: 1
id: CLIENT
name: Standard Client Task Sequence
description: >
  Deploys Windows to a bare machine: validate it, lay out the disk for its
  firmware, apply the image, stage the answer file, make it boot, and install
  applications on the far side of the restart.

variables:
  # WHAT AN AUTHOR IS EXPECTED TO CHANGE, gathered at the top rather than
  # scattered through the steps. Each is referenced below as "%Name%".
  HDTOSImage: Win11-LTSC-2024
  HDTOSImageIndex: 1

steps:

  # ------------------------------------------------------------ Initialization
  #
  # MDT's first group, and in its Client.xml it holds exactly one step: "Gather
  # local only". Everything after this point conditions on what it reads - the
  # firmware that picks a partition step, the TPM the validation checks, the
  # model a rule matches - so it runs before anything else.
  #
  # THE ENGINE HAS ALREADY GATHERED ONCE before the sequence started. This step
  # is not redundant: it is where the sequence SAYS the facts are read, so an
  # administrator can see it, move it, or add another after the disk is laid
  # out. MDT gathers three times in one sequence for that reason.
  - group: Initialization
    runIn: WinPE
    steps:
      - name: Gather local only
        type: Gather

  # ---------------------------------------------------------------- Validation
  #
  # MDT checks the machine can take the deployment BEFORE it wipes anything, and
  # the order matters more than the checks do: every minute spent validating is
  # a minute before the disk is destroyed.
  - group: Validation
    runIn: WinPE
    steps:
      # minRamMB is 2048 rather than 4096 deliberately - a 4 GB machine reports
      # slightly under 4096, because the firmware keeps some of it.
      - name: Validate
        type: Validate
        minRamMB: 2048
        minDiskGB: 60

  # ---------------------------------------------------------------- Preinstall
  #
  # Everything done to the disk while WinPE still owns the machine.
  - group: Preinstall
    runIn: WinPE
    steps:
      # THE PAIR, AND ONLY ONE OF THEM RUNS. The condition is the firmware the
      # machine actually booted, gathered before any step runs.
      #
      # wipe: true is the sequence declaring the target's contents expendable.
      # Without it a disk carrying any formatted volume is refused - and naming
      # the disk explicitly is not the same statement.
      # diskNumber: 0 IS WHAT MDT'S OWN Client.xml SETS - OSDDiskIndex 0 on both of
      # these steps - and it is the right default for a machine with one disk,
      # which is most of them.
      #
      # IT IS SAFE TO WRITE HERE AND NOT IN THE ADD MENU, and the difference is
      # who reads it. A template is opened and reviewed by the person creating
      # the sequence; a step added from a menu appears in the middle of a
      # sequence somebody else wrote and can be missed. The engine's own refusal
      # is unaffected either way: naming a disk never overrides the exclusions
      # that protect the disk this machine runs from, one that carries the
      # workspace, or one that is read-only or offline.
      #
      # ON A TWO-DISK MACHINE, CHECK IT. Disk 0 is not always the one you mean.
      # THE ROWS ARE WRITTEN OUT RATHER THAN NAMED, so the console's Format and
      # Partition Disk grid is editable the moment a sequence is created - which
      # is MDT's behaviour and was not HDT's. 'layout: uefi-standard' means "the
      # standard layout, whatever it becomes", and a step carrying it has no rows
      # of its own for the New, Edit, Remove and arrow buttons to act on. A
      # template that every sequence starts from is exactly the wrong place for
      # a table nobody can touch.
      #
      # THE NAMES ARE THE ROLES, AND THAT IS LOAD-BEARING. The step publishes
      # HDTSystemVolume, HDTOSVolume and HDTRecoveryVolume by role, and a row's
      # role is its name - so ApplyImage finds the volume through the name
      # written here. Renaming Windows to anything friendlier applies the image
      # to nowhere.
      #
      # A SEQUENCE THAT WOULD RATHER TRACK THE BUILT-IN still can: delete the
      # table and write 'layout: uefi-standard' in its place. Nothing about the
      # named layouts has changed, and Expand-HDTStepPartition converts the other
      # way for the sequences that name them.
      #
      # 260 MB FOR THE ESP is Microsoft's minimum for a 4Kn drive, which is what
      # FAT32 needs at a 4096-byte sector - MDT's 499 MB predates that guidance.
      # DESIGN 9.1.
      - name: Format and Partition Disk (UEFI)
        type: DiskPartition
        diskNumber: 0
        wipe: true
        condition: '$HDTIsUEFI -eq $true'
        partition:
          - name: System
            type: EFI
            size: 260MB
            filesystem: FAT32
          - name: Windows
            type: Primary
            size: remainder
            filesystem: NTFS
          - name: Recovery
            type: Recovery
            size: 1GB
            filesystem: NTFS

      # MBR BOOTS FROM AN ACTIVE PARTITION, which the first row is by default,
      # and 500 MB is the System Reserved size Windows setup has used since 7.
      - name: Format and Partition Disk (BIOS)
        type: DiskPartition
        diskNumber: 0
        wipe: true
        condition: '$HDTIsUEFI -eq $false'
        partition:
          - name: System
            type: Primary
            size: 500MB
            filesystem: NTFS
          - name: Windows
            type: Primary
            size: remainder
            filesystem: NTFS

  # ------------------------------------------------------------------- Install
  - group: Install
    runIn: WinPE
    steps:
      # THE VOLUME THE PARTITION STEP PUBLISHED, named rather than gestured at.
      # 'primary' means exactly this variable - the engine resolves one to the
      # other - and naming it is what tells a reader WHICH volume, and what to
      # change when a sequence applies somewhere else.
      #
      # It is never a guess at C:, which in WinPE is frequently the content disk.
      - name: Install Operating System
        type: ApplyImage
        os: "%HDTOSImage%"
        index: "%HDTOSImageIndex%"
        target: "%HDTOSVolume%"
        timeoutMinutes: 60

  # --------------------------------------------------------------- Postinstall
  #
  # The machine is imaged but has never started. Everything here is written into
  # a Windows that is not running yet.
  - group: Postinstall
    runIn: WinPE
    steps:
      # Staged at <os volume>\Windows\Panther\unattend.xml, which is where Setup
      # consumes it.
      - name: Apply Windows Settings
        type: ApplyUnattend
        template: unattend.xml

      # MDT'S Inject Drivers, AND IT SHIPS IN THE TEMPLATE FOR MDT'S REASON:
      # a client task sequence that does not inject drivers is one every
      # administrator has to remember to fix, on every sequence, for ever.
      #
      # HERE, BETWEEN THE SETTINGS AND THE BOOT CONFIGURATION, because injection
      # is OFFLINE into the volume the image was just applied to - it must come
      # after Install Operating System and before the machine boots off it.
      #
      # THE GROUP IS A PATH WITH VARIABLES IN IT, which is MDT's Total Control
      # method: 'Win11\Dell Inc.\Latitude 5420' resolves per machine from what
      # Gather read off the hardware. Nothing requires this shape - the store
      # under Drivers\ is yours, any names, any depth - but a template has to
      # show one, and this is the one New-HDTWorkspace already seeds as a
      # comment in rules.yaml.
      #
      # AND A SHARE WITH NO SUCH FOLDER STILL DEPLOYS. No group match means the
      # step asks the machine what hardware it has and injects what matches;
      # matching nothing is a completed step with a warning, not a failed
      # deployment, because a machine with inbox drivers still boots. So this
      # line is safe in a template that ships to shares holding no drivers at
      # all - which is every new one.
      - name: Inject Drivers
        type: ApplyDrivers
        group: 'Win11\%HDTMake%\%HDTModel%'
        mode: all

      # bcdboot, the recovery image, and then the FIRMWARE BOOT ORDER. Without
      # the last part the machine restarts into the installation media and the
      # deployment appears to loop.
      - name: Configure Boot
        type: ConfigureBoot

      # THE CERTIFICATES, CARRIED PAST THE RESTART BELOW. WinPE imported them
      # into a store on a RAM disk and that disk is about to disappear; the OS
      # would otherwise come up on the same 802.1X port with no identity, get no
      # address, and never reach the share the resume leg needs.
      #
      # THE CONDITION IS WHY THIS IS NOT IN EVERY LOG. Most images carry no
      # certificates at all, and a step that ran anyway would report success for
      # work nobody asked for. HDTHasCertificate is published from bootstrap.json
      # when the deployment starts - and an image that never set it leaves the
      # token unresolved, which the engine reads as false. Silence skips it.
      - name: Install Certificates
        type: InstallCertificate
        target: "%HDTOSVolume%"
        condition: "$HDTHasCertificate == True"

      # THE HANDOVER. Everything above ran in WinPE; everything below runs in the
      # Windows that is about to start for the first time.
      - name: Restart into Windows
        type: Restart

  # -------------------------------------------------------------- State Restore
  #
  # MDT's name for "the machine is now Windows and we are finishing the job".
  - group: State Restore
    runIn: FullOS
    steps:
      - name: Install Applications
        type: InstallApplications

      # ENCRYPTION LAST, AND ONLY IF ASKED FOR. The wizard's BitLocker page
      # sets these three; an unticked box leaves HDTEnableBitLocker false, the
      # condition is false and this step does not run - which is what every
      # deployment did before the page existed.
      #
      # AFTER THE APPLICATIONS, because encrypting a disk and then writing
      # several gigabytes to it is the slow way round, and a failed application
      # install on an encrypted volume is harder to get at.
      #
      # SCOPE AND METHOD ARE AUTHORED, NOT ASKED. They are a site's policy
      # rather than a decision at a bench, so they are written here once where
      # an administrator can change them for every machine.
      - name: Enable BitLocker
        type: EnableBitLocker
        condition: '$HDTEnableBitLocker -eq $true'
        scope: usedSpaceOnly
        method: XtsAes256
        protector: '%HDTBitLockerProtector%'
        escrow: '%HDTBitLockerEscrow%'
        recoveryPassword: true
        wait: false
