# HDT STANDARD REFERENCE-IMAGE TASK SEQUENCE
#
# The other half of MDT's pair. Its Client.xml deploys a machine; its
# "Sysprep and Capture" template turns a machine somebody has finished
# preparing into a WIM the share can deploy. This is that, in HDT's shape, and
# it closes DESIGN 9.3's loop: HDT builds its own reference images rather than
# depending on another tool to make them.
#
# THE WHOLE SEQUENCE IS THE FLOW IN ONE LINE:
#
#   deploy -> customize -> Sysprep -> Restart -> boot the media -> CaptureImage
#
# THREE THINGS MAKE THAT LAST ARROW WORK, AND THEY ARE NOT THE SAME THING.
#
# 1. BootToWinPE STAGES A WinPE ON THIS MACHINE AND ARMS ONE BOOT INTO IT.
#
# A deployment wants the machine to stop booting the media and start booting
# Windows, so ConfigureBoot puts the Windows Boot Manager first in the firmware
# order (SPIKES S6). A reference build needs BOTH: restart 1 must reach Windows,
# because that is the only window in which applications install and Sysprep can
# run at all, and restart 2 must reach WinPE, because a volume with Windows
# running on it is a volume being written while it is read.
#
# ONE FIRMWARE-ORDER SWITCH CANNOT SERVE BOTH, which is why this template used
# to turn setBootOrder off and stop at step 8 of 12. Measured on 2026-08-31:
# with it false the machine restarted at restart 1 straight back into WinPE and
# the run stopped - SPIKES S6's fourth finding word for word. No
# Windows\Panther\setupact.log on the disk afterwards, so Windows had never started.
#
# SO THE FIRMWARE ORDER IS LEFT ALONE ENTIRELY AND THE WINDOWS BOOT MANAGER DOES
# THE WORK, which is MDT's answer (LTIApply.wsf /PE /STAGE and /PE /BCD, driven
# by ZTIBCDUtility.vbs). A copy of the share's boot image is staged to
# <volume>\HDT\Boot, a ramdisk BCD entry points at it, and bcdedit /bootsequence
# hands that entry the NEXT boot and only the next boot. setBootOrder is back to
# true, so restart 1 reaches Windows; the one-shot fires at restart 2, so that
# one reaches WinPE.
#
# AND NOTHING IS SEALED UNTIL WE KNOW IT CAN COME BACK. Both BootToWinPE steps
# run BEFORE Sysprep and both FAIL the sequence rather than warning. A machine
# that has been generalized and cannot reach WinPE is stranded: there is no leg
# left that could fix it, and OOBE on the next boot burns one of three rearms.
#
# 2. Get-HDTResumeCandidate STOPS THAT BOOT WIPING THE DISK.
#
# AND UNTIL IT EXISTED, THE BOOT ORDER WAS THE ONLY THING BETWEEN THIS TEMPLATE
# AND A DESTROYED MACHINE, which is the frightening part in hindsight. The WinPE
# entry point minted a NEW run at step 1 on every boot, so the capture boot
# arrived, found no run in progress, and started this sequence again - at the
# DiskPartition step, against the volume it had just sealed. It is now asked
# rather than assumed: the entry point scans the lettered volumes for a state
# document before it mints anything, resumes the run it finds, and refuses
# outright the step types that would destroy the installation (DESIGN 4.3.1).
#
# THE TWO ARE INDEPENDENT ON PURPOSE. The first decides WHERE the machine boots;
# the second decides WHAT THE ENGINE DOES when it gets there, and holds however
# the machine arrived - one-shot boot entry, PXE, an ISO left in the drive, or a
# technician pressing F12. A check keyed to the transport would answer correctly
# for one of those and mint a fresh run - which formats the disk - for the rest.
#
# 3. THE ENTRY IS TORN DOWN AGAIN, IN WinPE, BEFORE THE CAPTURE.
#
# /bootsequence is consumed by the boot it caused, but the OSLOADER object it
# named stays in the store for ever, and half a gigabyte of staged WinPE stays
# on the disk. The third BootToWinPE step removes both. It WARNS rather than
# failing, because by then the capture is the only thing left that matters.
#
# The staged WinPE could not have reached the image in any case:
# Templates\Capture\wimscript.ini excludes \HDT as a tree, which is exactly why
# the staging goes there and nowhere else.
#
# WHAT IS BUILT AND WHAT IS STILL UNPROVEN, BECAUSE A GREEN TEST SUITE IS VERY
# GOOD AT SUPPORTING A CLAIM NOBODY HAS CHECKED ON A MACHINE.
#
# BUILT AND PROVEN AGAINST FAKES: the staging, the ramdisk entry, the one-shot,
# the teardown, and every refusal - including that a failure to stage or to arm
# stops the sequence BEFORE Sysprep rather than sealing a machine it cannot
# bring back.
#
# NOT YET PROVEN ON A MACHINE, and it is one question: WHETHER SYSPREP OBJECTS
# TO AN ARMED /bootsequence. MDT defers its BCD work past sysprep and says in a
# comment that it must, so somebody once hit something; the reasoning for why it
# does not apply here is in Invoke-HDTBootToWinPEStep's header and it is
# reasoning, not a measurement. If sysprep does object, the arm step above moves
# to just after Sysprep and the staging step stays where it is - the rule that
# nothing is sealed until we know it can come back survives either way.
#
# SO THIS TEMPLATE STILL DOES NOT YET RUN END TO END UNATTENDED, and that
# sentence stays here until a real reference build has done it on a machine. The
# tests being green is not that proof and cannot be: every one of them runs
# against hand-written fakes, and the open question is what a real sysprep.exe
# does, which no fake can answer.
#
# What HAS changed is that the mechanism exists at all. This template used to
# stop at step 8 of 12 with no product answer, and tests/e2e drove restart 2 by
# demoting the boot order from the HOST - which is exactly where a missing
# product mechanism shows up.
#
# %Variable% AND $Variable ARE THE SAME THING to the engine. This file uses the
# PowerShell spelling in conditions and %Name% inside quoted values, exactly as
# client.yaml does.

schemaVersion: 1
id: REFERENCE
name: Sysprep and Capture Reference Image
description: >
  Builds a reference image: deploy Windows to a scratch machine, customize it,
  generalize it with sysprep, restart into a WinPE staged on its own disk, and
  capture the volume into a WIM under Captures\ on the share.

variables:
  # WHAT AN AUTHOR IS EXPECTED TO CHANGE. The capture is named after the
  # sequence's own id, so a share that builds three reference images gets three
  # differently named WIMs without anybody typing a name, and a second run of
  # the same sequence overwrites its own output rather than somebody else's.
  HDTOSImage: Win11-LTSC-2024
  HDTOSImageIndex: 1

steps:

  # ------------------------------------------------------------ Initialization
  - group: Initialization
    runIn: WinPE
    steps:
      - name: Gather local only
        type: Gather

  # ---------------------------------------------------------------- Validation
  #
  # A REFERENCE BUILD NEEDS MORE DISK THAN A DEPLOYMENT DOES, because the WIM
  # it writes has to fit somewhere while it is being written and the capture
  # keeps its scratch on the same volume.
  - group: Validation
    runIn: WinPE
    steps:
      - name: Validate
        type: Validate
        minRamMB: 2048
        minDiskGB: 80

  # ---------------------------------------------------------------- Preinstall
  #
  # THE PAIR, AND ONLY ONE OF THEM RUNS - client.yaml's reasoning verbatim, and
  # for the same reason: a GPT disk on a BIOS machine fails after the image has
  # been applied.
  #
  # NO RECOVERY PARTITION ON THE UEFI LAYOUT. A reference machine is torn down
  # the moment its image has been captured; a recovery partition on it is a
  # gigabyte of disk that never recovers anything, and Recovery is not on the
  # volume being captured anyway.
  - group: Preinstall
    runIn: WinPE
    steps:
      - name: Format and Partition Disk (UEFI)
        type: DiskPartition
        diskNumber: 0
        wipe: true
        condition: '$HDTIsUEFI -eq $true'
        partition:
          - name: System
            type: EFI
            size: 260MB
            filesystem: FAT32
          - name: Windows
            type: Primary
            size: remainder
            filesystem: NTFS

      - name: Format and Partition Disk (BIOS)
        type: DiskPartition
        diskNumber: 0
        wipe: true
        condition: '$HDTIsUEFI -eq $false'
        partition:
          - name: System
            type: Primary
            size: 500MB
            filesystem: NTFS
          - name: Windows
            type: Primary
            size: remainder
            filesystem: NTFS

  # ------------------------------------------------------------------- Install
  - group: Install
    runIn: WinPE
    steps:
      - name: Install Operating System
        type: ApplyImage
        os: "%HDTOSImage%"
        index: "%HDTOSImageIndex%"
        target: "%HDTOSVolume%"
        timeoutMinutes: 60

  # --------------------------------------------------------------- Postinstall
  - group: Postinstall
    runIn: WinPE
    steps:
      # NO DRIVER INJECTION, AND THAT IS THE POINT OF A REFERENCE IMAGE. Drivers
      # belong to the machine they are for, and one baked into an image is one
      # every machine built from it carries whether it has the hardware or not.
      # The DEPLOYMENT injects them - client.yaml's Inject Drivers step - which
      # is MDT's model and the reason a reference image is hardware-independent
      # in the first place.

      - name: Apply Windows Settings
        type: ApplyUnattend
        template: unattend.xml

      # setBootOrder: true, AS ON ANY DEPLOYMENT, AND THAT IS THE CHANGE.
      # This used to be false, because the restart after Sysprep had to reach the
      # boot media and the firmware order was the only lever there was. It was
      # the wrong lever: it also sent the restart BELOW back into WinPE, so the
      # Customize group and the Sysprep step never ran at all. The capture boot
      # is now BootToWinPE's job, which leaves this one free to do what every
      # other sequence does - stop the machine booting the media.
      #
      # recovery: false FOLLOWS THE LAYOUT ABOVE. There is no recovery partition
      # on a reference machine, so registering one would name a volume that does
      # not exist.
      - name: Configure Boot
        type: ConfigureBoot
        setBootOrder: true
        recovery: false

      - name: Restart into Windows
        type: Restart

  # -------------------------------------------------------------- Customize
  #
  # THE REASON THIS SEQUENCE EXISTS, AND IT IS YOURS TO FILL IN.
  #
  # Everything that is supposed to end up INSIDE the image goes here:
  # applications, settings, updates, a script of your own. It runs in the full
  # OS on a machine that is not yet generalized, which is the only window in
  # which any of it can be installed.
  #
  # THE ONE STEP IN IT IS A PLACEHOLDER AND SAYS SO. A group with no steps is
  # legal and invisible; a group with a NoOp in it appears in the editor, in the
  # log and on the progress card, so the place to put the work is somewhere a
  # person actually sees.
  - group: Customize
    runIn: FullOS
    steps:
      # APPLICATIONS FIRST, BECAUSE THAT IS WHAT A REFERENCE IMAGE IS FOR.
      #
      # It names NOTHING, deliberately. selection reads %HDTApplications% - the
      # variable a rule or a wizard answer sets - so a share that names no
      # applications installs none and this step costs a line in the log, while
      # a share that names some gets them INSIDE the image rather than onto
      # every machine built from it afterwards. Naming any here would be
      # guessing at somebody's build standard, which is the one thing this
      # template must not do.
      #
      # AND IT SURVIVES A REBOOT THAT AN INSTALLER ASKS FOR. A 3010 returns
      # RebootRequested -Reenter, the run checkpoints what it has installed and
      # the next full-OS leg resumes at the NEXT application - so a reference
      # build with a service pack in it does not have to be split into two
      # sequences by hand.
      - name: Install Applications
        type: InstallApplications
        selection: "%HDTApplications%"

      - name: Customize the reference image
        type: NoOp
        message: >
          Nothing further has been customized. Replace this step with the
          settings, updates and scripts that belong inside the reference image.

  # -------------------------------------------------------------- Sysprep and Capture
  #
  # MDT'S OWN GROUP NAME, because an administrator arriving from Workbench is
  # looking for those words.
  #
  # THREE STEPS AND A REBOOT BETWEEN THEM, which is why this is not one step.
  # Sysprep runs in the full OS - sysprep.exe is not in WinPE at all - and the
  # capture runs in WinPE, because a volume with Windows running on it is a
  # volume being written while it is read.
  - group: Sysprep and Capture
    steps:
      # /quiet /generalize /oobe /quit, never /shutdown: the restart below is
      # what takes the machine down, through the checkpoint the WinPE leg
      # resumes from (DESIGN 9.3 note 1).
      #
      # AND IT CHECKS WHAT SYSPREP DID. ImageState has to read
      # IMAGE_STATE_GENERALIZE_RESEAL_TO_OOBE afterwards or the step fails,
      # because sysprep can exit 0 having declined to generalize.
      #
      # THE ANSWER FILE IS THE GENERALIZE PASS'S, NOT THE DEPLOYMENT'S. It sets
      # SkipRearm, which is what stops the third rebuild of a monthly reference
      # image being the last one that ever works, and it is staged where sysprep
      # looks and deleted afterwards so it does not travel inside the image.
      # New-HDTTaskSequence copies it in beside unattend.xml because this
      # sequence names it.
      # BOTH OF THESE RUN BEFORE THE SEAL, AND THAT IS THE WHOLE POINT OF THE
      # ORDER. A machine that has been generalized and cannot reach WinPE is
      # stranded - there is no leg left that could fix it - so everything that
      # could fail is done while this is still a Windows somebody can log into.
      #
      # MDT PUTS THE ARM AFTER SYSPREP (Client.xml:472, LTIApply /PE /BCD) with a
      # comment saying the BCD work is deferred "so that Sysprep doesn't
      # complain". That ordering leaves exactly the hole above. The reason MDT's
      # would upset sysprep is almost certainly AdjustBCDDefaults' /default,
      # which repoints the DEFAULT OS entry at a WinPE ramdisk; this sets
      # /bootsequence alone and leaves {default} naming Windows. If sysprep
      # objects anyway the step FAILS, on an unsealed machine - and moving this
      # step to just after Sysprep is then a two-line edit, with the staging
      # above still proving the machine can come back before anything is sealed.
      - name: Stage WinPE for the capture boot
        type: BootToWinPE
        runIn: FullOS
        action: stage

      - name: Boot into WinPE after sysprep
        type: BootToWinPE
        runIn: FullOS
        action: arm

      - name: Sysprep
        type: Sysprep
        runIn: FullOS
        unattend: unattend-sysprep.xml
        timeoutMinutes: 60

      # THE ONE LEGAL NEXT BOOT, AND IT IS THE STAGED WinPE. The BootToWinPE arm
      # step above pointed bcdedit /bootsequence at it, so the Windows Boot
      # Manager hands this boot - and only this boot - to WinPE, while the
      # firmware order goes on preferring Windows for every boot after it.
      #
      # A machine that booted the generalized installation instead would run OOBE
      # and burn a rearm, and the image would no longer be in the state it was
      # sysprepped into.
      - name: Restart into WinPE
        type: Restart
        runIn: FullOS
        message: restarting into the staged WinPE to capture this machine

      # AND THE CAPTURE, WHICH IS WHERE THE SEQUENCE HAS BEEN GOING ALL ALONG.
      #
      # It reads %HDTOSVolume% - the volume the partition step published, which
      # WinPE has mounted again after the restart - and writes into Captures\ on
      # the share, excluding what the share's Control\wimscript.ini names or,
      # failing that, what HDT ships. Never nothing: a capture with no exclusion
      # list swallows pagefile.sys and HDT's own working folder, and dism
      # reports that as success.
      #
      # max COMPRESSION, because a reference image is written once and then
      # stored, copied and read for years. A lab turning one round quickly can
      # change it to fast and roughly halve the time this step takes.
      # THE TEARDOWN, BEFORE THE CAPTURE READS THE VOLUME.
      #
      # /bootsequence is consumed by the boot it caused, but the OSLOADER object
      # it named stays in the store for ever and the staged WinPE stays on the
      # disk. This removes both.
      #
      # IT WARNS RATHER THAN FAILING, which is the opposite of the two steps
      # before Sysprep and right for the same reason they are not: by here the
      # capture is the only thing left that matters, and a cleanup that failed
      # would cost the whole build. The staged WinPE cannot reach the image
      # either way - wimscript.ini excludes \HDT as a tree, which is exactly why
      # it was staged there.
      - name: Remove the local WinPE
        type: BootToWinPE
        runIn: WinPE
        action: remove

      - name: Capture Image
        type: CaptureImage
        runIn: WinPE
        image: '%HDTTaskSequenceID%.wim'
        description: 'Reference image built by HDT'
        compress: max
        timeoutMinutes: 120
