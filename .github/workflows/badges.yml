name: Badges

# THE ONLY THING THAT WRITES THE badges BRANCH AFTER A GATE RUN, AND IT IS HERE
# BECAUSE IT CANNOT BE WHERE IT WAS.
#
# shields.io renders a badge from an endpoint document at any public URL, so
# build.ps1 writes out/badges/*.json and something pushes them to an orphan
# branch that holds nothing else. That "something" used to be a step inside the
# job that produced them, which worked for exactly as long as the producing job
# ran on GitHub's hardware.
#
# THE GATE MOVED TO A MACHINE SOMEBODY OWNS, AND A WRITABLE TOKEN CANNOT GO
# THERE. ci-lab.yml runs on GHRUNNER01, and a self-hosted job may not hold
# contents: write - a writable GITHUB_TOKEN on a machine on somebody's private
# LAN is what turns a compromised job into a compromised repository, and
# E2eWorkflow.Tests.ps1 refuses it over the whole set of workflow files. So the
# lab job uploads the numbers and this workflow, on a hosted runner, does the
# write.
#
# WHY workflow_run IS THE RIGHT TRIGGER AND NOT A CONVENIENCE. GitHub runs the
# DEFAULT BRANCH's copy of a workflow_run workflow, whatever the producing run
# was and whatever branch it was on. That is the property that makes it safe to
# hold contents: write here: nothing a pull request can edit decides what this
# file does. The same job written inside a fork-triggered workflow would be
# guarded by an `if:` the fork could rewrite in the same commit.
#
# IT DOES NOT CARE WHETHER THE GATE PASSED. build.ps1 writes the badges BEFORE
# it judges the suite, deliberately - a red run has a red badge to publish, and
# a badge that only updates when the build is green is a badge that always says
# green. So there is no `conclusion == 'success'` here; what is checked is the
# BRANCH, because a hand-started run on a topic branch still produces numbers
# and they are not the numbers the README is reporting.

on:
  workflow_run:
    workflows: [ CI-Lab ]
    types: [ completed ]

# ONE WRITER AT A TIME ON THAT BRANCH. The push has no rebase and no retry, so
# two workflows pushing it at once means one of them fails - and a failed badge
# push turns a green build red for a reason that appears nowhere in the build's
# own log. coverage.yml's badge job names this same group, and
# CiLabWorkflow.Tests.ps1 asserts that over the SET, so the third writer
# somebody adds is judged too.
#
# cancel-in-progress: false, AND THAT IS THE RACE AGAIN WEARING A DIFFERENT
# HAT. A push killed halfway leaves the branch carrying a tests badge from one
# run and a coverage badge from another, with nothing anywhere to say so.
# Queueing is the point; a badge that arrives ninety seconds late is a badge.
concurrency:
  group: badges
  cancel-in-progress: false

permissions:
  contents: write        # the badges branch, and nothing else on it
  actions: read          # download-artifact reaching into ANOTHER run needs this

jobs:
  publish:
    name: badges
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A hand-started CI-Lab run on a topic branch still writes badges. They are
    # that branch's numbers, and the README is not reporting that branch.
    if: github.event.workflow_run.head_branch == 'main'

    steps:
      # THE DEFAULT BRANCH'S COPY, WHICH IS WHAT workflow_run CHECKS OUT WITHOUT
      # BEING ASKED. It is needed for .github/actions/publish-badges below - a
      # local composite action is read from the checkout, so without this step
      # the `uses:` line resolves to nothing.
      - uses: actions/checkout@v4

      # FROM THE RUN THAT PRODUCED THEM, NOT FROM A BUILD OF ITS OWN. A second
      # build would answer a question nobody asked, on a different machine from
      # the one whose result is being reported.
      #
      # continue-on-error, BECAUSE THE ARTIFACT MAY NOT EXIST. A CI-Lab run that
      # fell over before build.ps1 wrote any badges has none to hand over, and
      # that is not a failure of this workflow - the action below says so and
      # exits clean.
      - name: Take the numbers from the run that produced them
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: badges
          path: out/badges
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish badges
        uses: ./.github/actions/publish-badges
        with:
          path: out/badges
          token: ${{ secrets.GITHUB_TOKEN }}
          message: badges

      - name: Summarise what was published
        if: always()
        run: |
          {
            echo '## HDT badges'
            echo
            echo "- from run [${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }})"
            echo "- head branch: ${{ github.event.workflow_run.head_branch }}"
            echo "- that run concluded: ${{ github.event.workflow_run.conclusion }}"
          } >> "$GITHUB_STEP_SUMMARY"
